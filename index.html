<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Practice Metronome</title>
<style>
:root {
  --bg: #15151a;
  --panel: #1e1e25;
  --divider: #2a2a33;
  --text: #e8e8ec;
  --text-muted: #9ba0a8;
  --accent: #f5a623;
  --accent-beat: #e5484d;
  --on-accent: #1a1305;
  --dot-idle: #666672;
  --radius: 8px;
  --radius-lg: 999px;
  --radius-round: 50%;

  /* Motion */
  --duration-instant: 0.05s;
  --duration-fast: 0.15s;

  /* Type weight */
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* Type scale */
  --text-xs:   0.75rem;
  --text-sm:   0.875rem;
  --text-base: 1rem;
  --text-hero: 4rem;

  /* Spacing scale */
  --space-3xs: 0.25rem;
  --space-2xs: 0.5rem;
  --space-xs:  0.75rem;
  --space-sm:  1rem;
  --space-md:  1.25rem;
  --space-lg:  1.5rem;
  --space-xl:  2rem;
  --space-2xl: 2.5rem;
  --space-3xl: 3rem;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: var(--duration-instant);
  }
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  max-width: 480px;
  margin: var(--space-2xl) auto;
  padding: 0 var(--space-md) var(--space-3xl);
  line-height: 1.45;
}

h1 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: center;
  margin: 0 0 var(--space-xl);
}

#topbar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-sm) var(--space-lg);
  align-items: end;
  padding-bottom: var(--space-md);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
  font-size: var(--text-xs);
}

#topbar .full {
  grid-column: 1 / -1;
}

#volumeValue {
  font-variant-numeric: tabular-nums;
}

#tabs {
  display: flex;
  gap: var(--space-lg);
  border-bottom: 1px solid var(--divider);
  margin-bottom: var(--space-xl);
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font: inherit;
  font-size: var(--text-base);
  padding: var(--space-xs) 0.05rem; /* horizontal inset stays hairline-thin so the active underline tracks the label width */
  margin-bottom: -1px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color var(--duration-fast) ease;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active {
  color: var(--accent);
  font-weight: var(--font-weight-semibold);
  border-bottom-color: var(--accent);
}

.panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  padding-bottom: var(--space-lg);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
}

.panel[hidden] { display: none; }

#heroZone {
  text-align: center;
  margin-bottom: var(--space-xl);
}

#heroBpm {
  font-size: var(--text-hero);
  font-weight: var(--font-weight-bold);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

#heroBpmLabel {
  font-size: var(--text-xs);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.35rem;
}

label,
.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.field-caption {
  display: block;
}

input[type="number"],
select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: var(--space-2xs);
  font: inherit;
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color var(--duration-fast) ease;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}

input[type="number"]:focus,
select:focus {
  border-color: var(--accent);
}

input[type="range"]:focus-visible,
input[type="number"]:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
}

button {
  font: inherit;
  cursor: pointer;
}

.tapTempo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: 0 var(--space-md);
  font-size: var(--text-sm);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: border-color var(--duration-fast) ease, color var(--duration-fast) ease, transform var(--duration-instant) ease;
}

.tapTempo:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.tapTempo:active {
  transform: scale(0.94);
}

.stepper-row {
  display: flex;
  gap: var(--space-2xs);
  align-items: stretch;
}

.stepper-row input[type="number"] {
  flex: 1;
  min-width: 0;
}

.step-group {
  display: flex;
  gap: var(--space-3xs);
}

.step-btn {
  flex: 0 0 auto;
  width: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, color var(--duration-fast) ease, transform var(--duration-instant) ease;
}

.step-btn.step-5 {
  width: 1.9rem;
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

.step-btn:hover {
  background: #26262f;
  border-color: var(--accent);
  color: var(--accent);
}

.step-btn:active {
  transform: scale(0.94);
}

#controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  margin-top: var(--space-2xs);
}

#startStop {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-3xl);
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.02em;
  transition: filter var(--duration-fast) ease, transform var(--duration-instant) ease;
}

#startStop:hover { filter: brightness(1.08); }
#startStop:active { transform: scale(0.98); }

#beatIndicator {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2xs);
  justify-content: center;
  margin-bottom: var(--space-sm);
}

.beat-dot {
  appearance: none;
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: var(--radius-round);
  background: var(--dot-idle);
  transition: background-color var(--duration-instant) ease, border-color var(--duration-fast) ease;
}

.beat-dot.accented { border-color: var(--accent-beat); }
.beat-dot.pulse { background: var(--accent); }
.beat-dot.pulse.accent { background: var(--accent-beat); }

/* Group dots in 4s so long rows (practice phases up to 64 beats) stay countable at a glance */
#beatIndicator .beat-dot:nth-child(4n):not(:last-child) {
  margin-right: var(--space-2xs);
}

.readout {
  font-size: var(--text-xs);
  color: var(--text-muted);
  min-height: 1.2em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  margin-top: var(--space-2xs);
}

.phase-segment {
  transition: font-size var(--duration-fast) ease, text-shadow var(--duration-fast) ease, color var(--duration-fast) ease;
}

.phase-segment.active {
  color: var(--accent);
  font-size: 1.1em;
  font-weight: var(--font-weight-semibold);
  text-shadow: 0 0 8px var(--accent);
}
</style>
</head>
<body>
  <h1>Guitar Practice&nbsp;Metronome</h1>

  <div id="topbar">
    <label>Beats per Bar
      <input id="timeSigNum" type="number" min="1" max="16" step="1" value="4">
    </label>
    <label>Subdivision
      <select id="subdivision">
        <option value="none">None</option>
        <option value="eighths">Eighths</option>
        <option value="triplets">Triplets</option>
        <option value="sixteenths">Sixteenths</option>
      </select>
    </label>
    <label>Sound
      <select id="soundStyle">
        <option value="click">Click</option>
        <option value="beep">Beep</option>
        <option value="wood">Wood Block</option>
      </select>
    </label>
    <label class="full">
      <span>Volume <span id="volumeValue">80%</span></span>
      <input id="volume" type="range" min="0" max="100" step="1" value="80">
    </label>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="metronome" type="button">Metronome</button>
    <button class="tab-btn" data-tab="ramp" type="button">Ramp</button>
    <button class="tab-btn" data-tab="practice" type="button">Practice</button>
  </div>

  <div id="heroZone">
    <div id="beatIndicator"></div>
    <div id="heroBpm">120</div>
    <div id="heroBpmLabel">BPM</div>
    <div id="rampReadout" class="readout" hidden></div>
    <div id="practiceReadout" class="readout" hidden></div>
  </div>

  <div id="panel-metronome" class="panel">
    <div class="field-group">
      <label class="field-caption" for="metronomeBpm">BPM</label>
      <div class="stepper-row">
        <div class="step-group">
          <button class="step-btn step-5" type="button" data-step-target="metronomeBpm" data-step="-5">&minus;5</button>
          <button class="step-btn" type="button" data-step-target="metronomeBpm" data-step="-1">&minus;</button>
        </div>
        <input id="metronomeBpm" type="number" min="20" max="400" step="1" value="120">
        <button class="tapTempo" type="button">Tap</button>
        <div class="step-group">
          <button class="step-btn" type="button" data-step-target="metronomeBpm" data-step="1">&plus;</button>
          <button class="step-btn step-5" type="button" data-step-target="metronomeBpm" data-step="5">&plus;5</button>
        </div>
      </div>
      <input id="metronomeBpmRange" type="range" min="20" max="400" step="1" value="120">
    </div>
    <div class="field-group">
      <label class="field-caption" for="metronomePercent">% of BPM</label>
      <div class="stepper-row">
        <div class="step-group">
          <button class="step-btn step-5" type="button" data-step-target="metronomePercent" data-step="-5">&minus;5</button>
          <button class="step-btn" type="button" data-step-target="metronomePercent" data-step="-1">&minus;</button>
        </div>
        <input id="metronomePercent" type="number" min="50" max="150" step="1" value="100">
        <div class="step-group">
          <button class="step-btn" type="button" data-step-target="metronomePercent" data-step="1">&plus;</button>
          <button class="step-btn step-5" type="button" data-step-target="metronomePercent" data-step="5">&plus;5</button>
        </div>
      </div>
      <input id="metronomePercentRange" type="range" min="50" max="150" step="1" value="100">
    </div>
  </div>

  <div id="panel-ramp" class="panel" hidden>
    <div class="field-group">
      <label class="field-caption" for="rampStartBpm">Start BPM</label>
      <div class="stepper-row">
        <div class="step-group">
          <button class="step-btn step-5" type="button" data-step-target="rampStartBpm" data-step="-5">&minus;5</button>
          <button class="step-btn" type="button" data-step-target="rampStartBpm" data-step="-1">&minus;</button>
        </div>
        <input id="rampStartBpm" type="number" min="20" max="400" step="1" value="80">
        <button class="tapTempo" type="button">Tap</button>
        <div class="step-group">
          <button class="step-btn" type="button" data-step-target="rampStartBpm" data-step="1">&plus;</button>
          <button class="step-btn step-5" type="button" data-step-target="rampStartBpm" data-step="5">&plus;5</button>
        </div>
      </div>
      <input id="rampStartBpmRange" type="range" min="20" max="400" step="1" value="80">
    </div>
    <div class="field-group">
      <label class="field-caption" for="rampStopBpm">Stop BPM</label>
      <div class="stepper-row">
        <div class="step-group">
          <button class="step-btn step-5" type="button" data-step-target="rampStopBpm" data-step="-5">&minus;5</button>
          <button class="step-btn" type="button" data-step-target="rampStopBpm" data-step="-1">&minus;</button>
        </div>
        <input id="rampStopBpm" type="number" min="20" max="400" step="1" value="140">
        <button class="tapTempo" type="button">Tap</button>
        <div class="step-group">
          <button class="step-btn" type="button" data-step-target="rampStopBpm" data-step="1">&plus;</button>
          <button class="step-btn step-5" type="button" data-step-target="rampStopBpm" data-step="5">&plus;5</button>
        </div>
      </div>
      <input id="rampStopBpmRange" type="range" min="20" max="400" step="1" value="140">
    </div>
    <label>Scale Mode
      <select id="rampScaleMode">
        <option value="percent">% per step</option>
        <option value="fixed">Fixed BPM per step</option>
      </select>
    </label>
    <div class="field-group">
      <label class="field-caption" for="rampScaleAmount">Scale Amount</label>
      <div class="stepper-row">
        <button class="step-btn" type="button" data-step-target="rampScaleAmount" data-step="-0.1">&minus;</button>
        <input id="rampScaleAmount" type="number" min="0.1" step="0.1" value="2">
        <button class="step-btn" type="button" data-step-target="rampScaleAmount" data-step="0.1">&plus;</button>
      </div>
    </div>
    <div class="field-group">
      <label class="field-caption" for="rampStepBars">Step Length (bars)</label>
      <div class="stepper-row">
        <button class="step-btn" type="button" data-step-target="rampStepBars" data-step="-1">&minus;</button>
        <input id="rampStepBars" type="number" min="1" step="1" value="4">
        <button class="step-btn" type="button" data-step-target="rampStepBars" data-step="1">&plus;</button>
      </div>
    </div>
  </div>

  <div id="panel-practice" class="panel" hidden>
    <div class="field-group">
      <label class="field-caption" for="practiceBaseBpm">Base (Fast) BPM</label>
      <div class="stepper-row">
        <div class="step-group">
          <button class="step-btn step-5" type="button" data-step-target="practiceBaseBpm" data-step="-5">&minus;5</button>
          <button class="step-btn" type="button" data-step-target="practiceBaseBpm" data-step="-1">&minus;</button>
        </div>
        <input id="practiceBaseBpm" type="number" min="20" max="400" step="1" value="120">
        <button class="tapTempo" type="button">Tap</button>
        <div class="step-group">
          <button class="step-btn" type="button" data-step-target="practiceBaseBpm" data-step="1">&plus;</button>
          <button class="step-btn step-5" type="button" data-step-target="practiceBaseBpm" data-step="5">&plus;5</button>
        </div>
      </div>
      <input id="practiceBaseBpmRange" type="range" min="20" max="400" step="1" value="120">
    </div>
    <div class="field-group">
      <label class="field-caption" for="practiceDeltaPercent">Speed Delta %</label>
      <div class="stepper-row">
        <div class="step-group">
          <button class="step-btn step-5" type="button" data-step-target="practiceDeltaPercent" data-step="-5">&minus;5</button>
          <button class="step-btn" type="button" data-step-target="practiceDeltaPercent" data-step="-1">&minus;</button>
        </div>
        <input id="practiceDeltaPercent" type="number" min="10" max="90" step="1" value="50">
        <div class="step-group">
          <button class="step-btn" type="button" data-step-target="practiceDeltaPercent" data-step="1">&plus;</button>
          <button class="step-btn step-5" type="button" data-step-target="practiceDeltaPercent" data-step="5">&plus;5</button>
        </div>
      </div>
      <input id="practiceDeltaPercentRange" type="range" min="10" max="90" step="1" value="50">
    </div>
    <div class="field-group">
      <label class="field-caption" for="practiceBeatsPerPhase">Beats per Phase</label>
      <div class="stepper-row">
        <button class="step-btn" type="button" data-step-target="practiceBeatsPerPhase" data-step="-1">&minus;</button>
        <input id="practiceBeatsPerPhase" type="number" min="1" max="64" step="1" value="4">
        <button class="step-btn" type="button" data-step-target="practiceBeatsPerPhase" data-step="1">&plus;</button>
      </div>
    </div>
    <div class="field-group">
      <label class="field-caption" for="practiceBreakBeats">Break Length (beats)</label>
      <div class="stepper-row">
        <button class="step-btn" type="button" data-step-target="practiceBreakBeats" data-step="-1">&minus;</button>
        <input id="practiceBreakBeats" type="number" min="1" max="64" step="1" value="4">
        <button class="step-btn" type="button" data-step-target="practiceBreakBeats" data-step="1">&plus;</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="startStop" type="button">Start</button>
  </div>

<script>
// LOGIC-BEGIN
function clampBpm(bpm) {
  const n = Math.round(Number(bpm));
  if (Number.isNaN(n)) return 120;
  return Math.min(400, Math.max(20, n));
}

function clampBpmPercent(pct) {
  const n = Math.round(Number(pct));
  if (Number.isNaN(n)) return 100;
  return Math.min(150, Math.max(50, n));
}

function computeEffectiveBpm(bpm, percent) {
  return clampBpm(bpm * (percent / 100));
}

function subdivisionCount(subdivision) {
  const table = { none: 1, eighths: 2, triplets: 3, sixteenths: 4 };
  return table[subdivision] || 1;
}

function beatIntervalSeconds(bpm) {
  return 60 / bpm;
}

function subdivisionIntervalSeconds(bpm, subdivision) {
  return beatIntervalSeconds(bpm) / subdivisionCount(subdivision);
}

function isAccentBeat(beatIndexInBar, accentPattern) {
  return Boolean(accentPattern && accentPattern[beatIndexInBar]);
}

function bpmFromTapTimestamps(timestamps) {
  if (!Array.isArray(timestamps) || timestamps.length < 2) return null;
  const diffs = [];
  for (let i = 1; i < timestamps.length; i++) {
    const diff = timestamps[i] - timestamps[i - 1];
    if (diff > 0 && diff <= 2000) diffs.push(diff);
  }
  if (diffs.length === 0) return null;
  const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  return clampBpm(60000 / avg);
}

function inferRampDirection(startBpm, stopBpm) {
  if (startBpm === stopBpm) return null;
  return startBpm < stopBpm ? 'up' : 'down';
}

function computeNextRampBpm(currentBpm, direction, scaleMode, scaleAmount, stopBpm) {
  if (direction === null) return stopBpm;
  const delta = scaleMode === 'percent' ? currentBpm * (scaleAmount / 100) : scaleAmount;
  let next = direction === 'up' ? currentBpm + delta : currentBpm - delta;
  next = direction === 'up' ? Math.min(next, stopBpm) : Math.max(next, stopBpm);
  let rounded = Math.round(next);
  // A tiny step (e.g. 2% of a low BPM) can round back to currentBpm, stalling the
  // ramp forever since beatsIntoStep resets without the tempo ever changing.
  // Force at least a 1-BPM move toward the target, still clamped at stopBpm.
  if (direction === 'up' && rounded <= currentBpm) {
    rounded = Math.min(currentBpm + 1, stopBpm);
  } else if (direction === 'down' && rounded >= currentBpm) {
    rounded = Math.max(currentBpm - 1, stopBpm);
  }
  return rounded;
}

function barsToBeats(bars, timeSigNumerator) {
  return bars * timeSigNumerator;
}

function computeSlowBpm(baseBpm, deltaPercent) {
  return clampBpm(baseBpm * (1 - deltaPercent / 100));
}

function buildPracticePhaseSequence(beatsPerPhase, breakBeats) {
  const seq = [];
  for (let i = 0; i < beatsPerPhase; i++) seq.push('slow');
  for (let i = 0; i < breakBeats; i++) seq.push('break');
  for (let i = 0; i < beatsPerPhase; i++) seq.push('fast');
  for (let i = 0; i < breakBeats; i++) seq.push('break');
  return seq;
}

function bpmForPhase(phase, baseBpm, slowBpm) {
  return phase === 'fast' ? baseBpm : slowBpm;
}

function serializeSettings(state) {
  return JSON.stringify(state);
}

function deserializeSettings(json, defaults) {
  const merged = JSON.parse(JSON.stringify(defaults));
  let parsed;
  try {
    parsed = JSON.parse(json);
  } catch (e) {
    return merged;
  }
  if (!parsed || typeof parsed !== 'object') return merged;
  for (const section of Object.keys(defaults)) {
    if (parsed[section] && typeof parsed[section] === 'object') {
      Object.assign(merged[section], parsed[section]);
    }
  }
  return merged;
}

function clampPositiveInt(value, fallback) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n) || n < 1) return fallback;
  return n;
}

function resizeAccentPattern(pattern, newLength) {
  const result = [];
  for (let i = 0; i < newLength; i++) {
    result.push(Boolean(pattern && pattern[i]));
  }
  return result;
}

function practiceSegmentIndex(sequenceIndex, beatsPerPhase, breakBeats) {
  if (sequenceIndex < beatsPerPhase) return 0;
  if (sequenceIndex < beatsPerPhase + breakBeats) return 1;
  if (sequenceIndex < beatsPerPhase + breakBeats + beatsPerPhase) return 2;
  return 3;
}

function practicePhasePosition(sequenceIndex, beatsPerPhase, breakBeats) {
  if (sequenceIndex < beatsPerPhase) return sequenceIndex;
  if (sequenceIndex < beatsPerPhase + breakBeats) return sequenceIndex - beatsPerPhase;
  if (sequenceIndex < beatsPerPhase + breakBeats + beatsPerPhase) return sequenceIndex - (beatsPerPhase + breakBeats);
  return sequenceIndex - (beatsPerPhase + breakBeats + beatsPerPhase);
}
// LOGIC-END
</script>
<script>
const DEFAULT_STATE = {
  topBar: { timeSigNum: 4, subdivision: 'none', soundStyle: 'click', volume: 80, activeTab: 'metronome', accentPattern: [true, false, false, false] },
  metronome: { bpm: 120, percent: 100 },
  ramp: { startBpm: 80, stopBpm: 140, scaleMode: 'percent', scaleAmount: 2, stepBars: 4 },
  practice: { baseBpm: 120, deltaPercent: 50, beatsPerPhase: 4, breakBeats: 4 },
};

const STORAGE_KEY = 'guitarMetronomeSettings';
let state = deserializeSettings(localStorage.getItem(STORAGE_KEY), DEFAULT_STATE);

function persistState() {
  localStorage.setItem(STORAGE_KEY, serializeSettings(state));
}

function refreshAllInputsFromState() {
  document.getElementById('timeSigNum').value = state.topBar.timeSigNum;
  document.getElementById('subdivision').value = state.topBar.subdivision;
  document.getElementById('soundStyle').value = state.topBar.soundStyle;
  document.getElementById('volume').value = state.topBar.volume;
  document.getElementById('volumeValue').textContent = state.topBar.volume + '%';

  document.getElementById('metronomeBpm').value = state.metronome.bpm;
  document.getElementById('metronomeBpmRange').value = state.metronome.bpm;
  document.getElementById('metronomePercent').value = state.metronome.percent;
  document.getElementById('metronomePercentRange').value = state.metronome.percent;

  document.getElementById('rampStartBpm').value = state.ramp.startBpm;
  document.getElementById('rampStartBpmRange').value = state.ramp.startBpm;
  document.getElementById('rampStopBpm').value = state.ramp.stopBpm;
  document.getElementById('rampStopBpmRange').value = state.ramp.stopBpm;
  document.getElementById('rampScaleMode').value = state.ramp.scaleMode;
  document.getElementById('rampScaleAmount').value = state.ramp.scaleAmount;
  document.getElementById('rampStepBars').value = state.ramp.stepBars;

  document.getElementById('practiceBaseBpm').value = state.practice.baseBpm;
  document.getElementById('practiceBaseBpmRange').value = state.practice.baseBpm;
  document.getElementById('practiceDeltaPercent').value = state.practice.deltaPercent;
  document.getElementById('practiceDeltaPercentRange').value = state.practice.deltaPercent;
  document.getElementById('practiceBeatsPerPhase').value = state.practice.beatsPerPhase;
  document.getElementById('practiceBreakBeats').value = state.practice.breakBeats;

  const validTabs = ['metronome', 'ramp', 'practice'];
  const activeTab = validTabs.includes(state.topBar.activeTab) ? state.topBar.activeTab : 'metronome';
  switchTab(activeTab);
}

function bindTopBar() {
  const timeSigNum = document.getElementById('timeSigNum');
  const subdivision = document.getElementById('subdivision');
  const soundStyle = document.getElementById('soundStyle');
  const volume = document.getElementById('volume');

  timeSigNum.addEventListener('input', () => {
    state.topBar.timeSigNum = clampPositiveInt(timeSigNum.value, DEFAULT_STATE.topBar.timeSigNum);
    state.topBar.accentPattern = resizeAccentPattern(state.topBar.accentPattern, state.topBar.timeSigNum);
    if (!(isPlaying && state.topBar.activeTab === 'practice')) renderBeatDots();
    persistState();
  });
  subdivision.addEventListener('change', () => {
    state.topBar.subdivision = subdivision.value;
    persistState();
  });
  soundStyle.addEventListener('change', () => {
    state.topBar.soundStyle = soundStyle.value;
    persistState();
  });
  volume.addEventListener('input', () => {
    state.topBar.volume = Number(volume.value);
    document.getElementById('volumeValue').textContent = state.topBar.volume + '%';
    persistState();
  });
}

bindTopBar();

let audioCtx = null;
let isPlaying = false;
let nextNoteTime = 0;
let schedulerTimerId = null;
let beatIndexInBar = 0;

const LOOKAHEAD_MS = 25;
const SCHEDULE_AHEAD_SEC = 0.1;

function ensureAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function soundFrequency(style, accent) {
  const table = {
    click: accent ? 1500 : 1000,
    beep: accent ? 1800 : 1200,
    wood: accent ? 900 : 500,
  };
  return table[style] || table.click;
}

function scheduleClick(time, accent, isSubdivision) {
  const ctx = ensureAudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = state.topBar.soundStyle === 'wood' ? 'triangle' : 'sine';
  osc.frequency.value = soundFrequency(state.topBar.soundStyle, accent);
  const vol = (state.topBar.volume / 100) * (accent ? 1.0 : isSubdivision ? 0.4 : 0.7);
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  osc.start(time);
  osc.stop(time + 0.06);
}

function flashBeatIndicator(beatIndex, accent) {
  const dots = document.getElementById('beatIndicator').children;
  const dot = dots[beatIndex];
  if (!dot) return;
  dot.classList.add('pulse');
  dot.classList.toggle('accent', accent);
  dot.addEventListener('transitionend', () => dot.classList.remove('pulse'), { once: true });
}

function renderBeatDots() {
  const container = document.getElementById('beatIndicator');
  container.removeAttribute('aria-hidden');
  container.innerHTML = '';
  const n = state.topBar.timeSigNum;
  for (let i = 0; i < n; i++) {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'beat-dot';
    dot.addEventListener('click', () => toggleAccent(i));
    container.appendChild(dot);
  }
  updateAccentDotStyles();
}

function renderPracticeProgressDots(count) {
  const container = document.getElementById('beatIndicator');
  container.setAttribute('aria-hidden', 'true');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    dot.className = 'beat-dot';
    container.appendChild(dot);
  }
}

function toggleAccent(index) {
  const pattern = state.topBar.accentPattern.slice();
  pattern[index] = !pattern[index];
  state.topBar.accentPattern = pattern;
  updateAccentDotStyles();
  persistState();
}

function updateAccentDotStyles() {
  const dots = document.getElementById('beatIndicator').children;
  state.topBar.accentPattern.forEach((accented, i) => {
    const dot = dots[i];
    if (!dot) return;
    dot.classList.toggle('accented', accented);
    dot.setAttribute('aria-pressed', String(accented));
    dot.setAttribute('aria-label', `Beat ${i + 1}, ${accented ? 'accented' : 'not accented'}`);
  });
}

let rampRuntime = null;

let practiceRuntime = null;

function currentModeBpm() {
  if (state.topBar.activeTab === 'ramp') {
    return rampRuntime.currentBpm;
  }
  if (state.topBar.activeTab === 'practice') {
    const slowBpm = computeSlowBpm(state.practice.baseBpm, state.practice.deltaPercent);
    return bpmForPhase(practiceRuntime.sequence[practiceRuntime.index], state.practice.baseBpm, slowBpm);
  }
  return computeEffectiveBpm(state.metronome.bpm, state.metronome.percent);
}

function updateRampReadout(explicitDisplay) {
  const display = explicitDisplay !== undefined
    ? explicitDisplay
    : (rampRuntime ? { currentBpm: rampRuntime.currentBpm, direction: rampRuntime.direction } : null);
  if (!display) return;
  document.getElementById('rampReadout').textContent =
    `Current: ${display.currentBpm} BPM` + (display.direction === null ? ' (holding at target)' : '');
}

const PHASE_SEGMENT_LABELS = ['SLOW', 'BREAK', 'FAST', 'BREAK'];
let phaseSegmentSpans = null;

function buildPhaseSegmentSpans() {
  const el = document.getElementById('practiceReadout');
  el.innerHTML = '';
  phaseSegmentSpans = PHASE_SEGMENT_LABELS.map((label, i) => {
    if (i > 0) el.appendChild(document.createTextNode(' - '));
    const span = document.createElement('span');
    span.className = 'phase-segment';
    span.textContent = label;
    el.appendChild(span);
    return span;
  });
}

function updatePracticeReadout(explicitSegment) {
  if (!phaseSegmentSpans) buildPhaseSegmentSpans();
  const activeSegment = explicitSegment !== undefined
    ? explicitSegment
    : (isPlaying && practiceRuntime)
      ? practiceSegmentIndex(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
      : 0;
  phaseSegmentSpans.forEach((span, i) => {
    span.classList.toggle('active', i === activeSegment);
  });
}

function updateHeroBpm(explicitBpm) {
  const el = document.getElementById('heroBpm');
  let bpm = explicitBpm;
  if (bpm === undefined) {
    if (state.topBar.activeTab === 'ramp') {
      bpm = (isPlaying && rampRuntime) ? rampRuntime.currentBpm : clampBpm(state.ramp.startBpm);
    } else if (state.topBar.activeTab === 'practice') {
      if (isPlaying && practiceRuntime) {
        const slowBpm = computeSlowBpm(state.practice.baseBpm, state.practice.deltaPercent);
        bpm = bpmForPhase(practiceRuntime.sequence[practiceRuntime.index], state.practice.baseBpm, slowBpm);
      } else {
        bpm = clampBpm(state.practice.baseBpm);
      }
    } else {
      bpm = computeEffectiveBpm(state.metronome.bpm, state.metronome.percent);
    }
  }
  el.textContent = bpm;
}

function advanceModeAfterBeat() {
  if (state.topBar.activeTab === 'ramp' && rampRuntime) {
    rampRuntime.beatsIntoStep++;
    const beatsPerStep = barsToBeats(state.ramp.stepBars, state.topBar.timeSigNum);
    if (rampRuntime.direction !== null && rampRuntime.beatsIntoStep >= beatsPerStep) {
      rampRuntime.currentBpm = computeNextRampBpm(
        rampRuntime.currentBpm, rampRuntime.direction, state.ramp.scaleMode,
        state.ramp.scaleAmount, state.ramp.stopBpm
      );
      rampRuntime.beatsIntoStep = 0;
      if (rampRuntime.currentBpm === state.ramp.stopBpm) rampRuntime.direction = null;
    }
  } else if (state.topBar.activeTab === 'practice' && practiceRuntime) {
    practiceRuntime.index = (practiceRuntime.index + 1) % practiceRuntime.sequence.length;
  }
}

function scheduleBeat(time) {
  const bpm = currentModeBpm();
  const beatIndex = beatIndexInBar;
  const scheduledTab = state.topBar.activeTab;
  const isPracticeMode = scheduledTab === 'practice' && practiceRuntime;
  const isPracticeBreak = isPracticeMode && practiceRuntime.sequence[practiceRuntime.index] === 'break';
  const accent = !isPracticeBreak && isAccentBeat(beatIndex, state.topBar.accentPattern);
  scheduleClick(time, accent, false);

  const subCount = subdivisionCount(state.topBar.subdivision);
  const subInterval = subdivisionIntervalSeconds(bpm, state.topBar.subdivision);
  for (let s = 1; s < subCount; s++) {
    scheduleClick(time + subInterval * s, false, true);
  }

  const rampDisplay = (state.topBar.activeTab === 'ramp' && rampRuntime)
    ? { currentBpm: rampRuntime.currentBpm, direction: rampRuntime.direction }
    : null;
  const practiceSegment = isPracticeMode
    ? practiceSegmentIndex(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
    : null;
  const dotIndex = isPracticeMode
    ? practicePhasePosition(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
    : beatIndex;
  const dotCount = isPracticeMode
    ? (isPracticeBreak ? practiceRuntime.breakBeats : practiceRuntime.beatsPerPhase)
    : null;
  const dotRuntime = isPracticeMode ? practiceRuntime : null;

  const ctx = ensureAudioContext();
  setTimeout(() => {
    if (!isPlaying || state.topBar.activeTab !== scheduledTab) return;
    if (dotCount !== null && practiceRuntime === dotRuntime
        && document.getElementById('beatIndicator').children.length !== dotCount) {
      renderPracticeProgressDots(dotCount);
    }
    flashBeatIndicator(dotIndex, accent);
    updateHeroBpm(bpm);
    if (rampDisplay) updateRampReadout(rampDisplay);
    if (practiceSegment !== null) updatePracticeReadout(practiceSegment);
  }, Math.max(0, (time - ctx.currentTime) * 1000));

  beatIndexInBar = (beatIndexInBar + 1) % state.topBar.timeSigNum;
  advanceModeAfterBeat();
  nextNoteTime = time + beatIntervalSeconds(bpm);
}

function schedulerTick() {
  const ctx = ensureAudioContext();
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD_SEC) {
    scheduleBeat(nextNoteTime);
  }
  schedulerTimerId = setTimeout(schedulerTick, LOOKAHEAD_MS);
}

function startPlayback() {
  if (isPlaying) return;
  const ctx = ensureAudioContext();
  if (ctx.state === 'suspended') ctx.resume();
  isPlaying = true;
  beatIndexInBar = 0;
  nextNoteTime = ctx.currentTime + 0.05;
  if (state.topBar.activeTab === 'ramp') {
    rampRuntime = {
      currentBpm: clampBpm(state.ramp.startBpm),
      direction: inferRampDirection(state.ramp.startBpm, state.ramp.stopBpm),
      beatsIntoStep: 0,
    };
    updateRampReadout();
  }
  if (state.topBar.activeTab === 'practice') {
    practiceRuntime = {
      sequence: buildPracticePhaseSequence(state.practice.beatsPerPhase, state.practice.breakBeats),
      beatsPerPhase: state.practice.beatsPerPhase,
      breakBeats: state.practice.breakBeats,
      index: 0,
    };
    renderPracticeProgressDots(practiceRuntime.beatsPerPhase);
    updatePracticeReadout();
  }
  schedulerTick();
  document.getElementById('startStop').textContent = 'Stop';
}

function stopPlayback() {
  if (!isPlaying) return;
  isPlaying = false;
  clearTimeout(schedulerTimerId);
  document.getElementById('startStop').textContent = 'Start';
  updatePracticeReadout();
  if (state.topBar.activeTab === 'practice') renderBeatDots();
}

document.getElementById('startStop').addEventListener('click', () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  e.preventDefault();
  if (isPlaying) stopPlayback(); else startPlayback();
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn && e.detail !== 0) btn.blur();
});

function bindMetronomeTab() {
  const bpm = document.getElementById('metronomeBpm');
  const bpmRange = document.getElementById('metronomeBpmRange');
  const percent = document.getElementById('metronomePercent');
  const percentRange = document.getElementById('metronomePercentRange');

  function setBpm(value) {
    state.metronome.bpm = clampBpm(value);
    bpm.value = state.metronome.bpm;
    bpmRange.value = state.metronome.bpm;
    updateHeroBpm();
  }
  function setPercent(value) {
    state.metronome.percent = clampBpmPercent(value);
    percent.value = state.metronome.percent;
    percentRange.value = state.metronome.percent;
    updateHeroBpm();
  }

  bpm.addEventListener('change', () => { setBpm(bpm.value); persistState(); });
  bpmRange.addEventListener('input', () => { setBpm(bpmRange.value); persistState(); });
  percent.addEventListener('change', () => { setPercent(percent.value); persistState(); });
  percentRange.addEventListener('input', () => { setPercent(percentRange.value); persistState(); });

  const stepperFields = {
    metronomeBpm: { input: bpm, set: setBpm },
    metronomePercent: { input: percent, set: setPercent },
  };

  document.getElementById('panel-metronome').querySelectorAll('.step-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.step);
      const field = stepperFields[btn.dataset.stepTarget];
      field.set(Number(field.input.value) + delta);
      persistState();
    });
  });
}

bindMetronomeTab();

let tapTimestamps = [];

const BPM_FIELD_MAP = {
  metronomeBpm: { key: 'metronome', prop: 'bpm', updatesHero: true },
  rampStartBpm: { key: 'ramp', prop: 'startBpm', updatesHero: true },
  rampStopBpm: { key: 'ramp', prop: 'stopBpm', updatesHero: false },
  practiceBaseBpm: { key: 'practice', prop: 'baseBpm', updatesHero: true },
};

document.querySelectorAll('.tapTempo').forEach((btn) => {
  const input = btn.previousElementSibling;
  const target = BPM_FIELD_MAP[input.id];

  btn.addEventListener('click', () => {
    const now = Date.now();
    if (tapTimestamps.length > 0 && now - tapTimestamps[tapTimestamps.length - 1] > 2000) {
      tapTimestamps = [];
    }
    tapTimestamps.push(now);
    if (tapTimestamps.length > 8) tapTimestamps = tapTimestamps.slice(-8);

    const bpm = bpmFromTapTimestamps(tapTimestamps);
    if (bpm === null) return;

    state[target.key][target.prop] = bpm;
    input.value = bpm;
    const range = document.getElementById(input.id + 'Range');
    if (range) range.value = bpm;
    if (target.updatesHero) updateHeroBpm();
    persistState();
  });
});

function switchTab(tabName) {
  if (isPlaying) stopPlayback();
  state.topBar.activeTab = tabName;
  persistState();

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  document.getElementById('panel-metronome').hidden = tabName !== 'metronome';
  document.getElementById('panel-ramp').hidden = tabName !== 'ramp';
  document.getElementById('panel-practice').hidden = tabName !== 'practice';
  document.getElementById('rampReadout').hidden = tabName !== 'ramp';
  document.getElementById('practiceReadout').hidden = tabName !== 'practice';
  updateHeroBpm();
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function bindRampTab() {
  const startBpm = document.getElementById('rampStartBpm');
  const startBpmRange = document.getElementById('rampStartBpmRange');
  const stopBpm = document.getElementById('rampStopBpm');
  const stopBpmRange = document.getElementById('rampStopBpmRange');
  const scaleMode = document.getElementById('rampScaleMode');
  const scaleAmount = document.getElementById('rampScaleAmount');
  const stepBars = document.getElementById('rampStepBars');

  function setStartBpm(value) {
    state.ramp.startBpm = clampBpm(value);
    startBpm.value = state.ramp.startBpm;
    startBpmRange.value = state.ramp.startBpm;
    updateHeroBpm();
  }
  function setStopBpm(value) {
    state.ramp.stopBpm = clampBpm(value);
    stopBpm.value = state.ramp.stopBpm;
    stopBpmRange.value = state.ramp.stopBpm;
  }
  function setScaleAmount(value) {
    const n = Number(value);
    state.ramp.scaleAmount = Number.isFinite(n) && n > 0 ? Math.round(n * 10) / 10 : DEFAULT_STATE.ramp.scaleAmount;
    scaleAmount.value = state.ramp.scaleAmount;
  }
  function setStepBars(value) {
    state.ramp.stepBars = clampPositiveInt(value, DEFAULT_STATE.ramp.stepBars);
    stepBars.value = state.ramp.stepBars;
  }

  startBpm.addEventListener('change', () => { setStartBpm(startBpm.value); persistState(); });
  startBpmRange.addEventListener('input', () => { setStartBpm(startBpmRange.value); persistState(); });
  stopBpm.addEventListener('change', () => { setStopBpm(stopBpm.value); persistState(); });
  stopBpmRange.addEventListener('input', () => { setStopBpm(stopBpmRange.value); persistState(); });
  scaleMode.addEventListener('change', () => { state.ramp.scaleMode = scaleMode.value; persistState(); });
  scaleAmount.addEventListener('change', () => { setScaleAmount(scaleAmount.value); persistState(); });
  stepBars.addEventListener('change', () => { setStepBars(stepBars.value); persistState(); });

  const stepperFields = {
    rampStartBpm: { input: startBpm, set: setStartBpm },
    rampStopBpm: { input: stopBpm, set: setStopBpm },
    rampScaleAmount: { input: scaleAmount, set: setScaleAmount },
    rampStepBars: { input: stepBars, set: setStepBars },
  };

  document.getElementById('panel-ramp').querySelectorAll('.step-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.step);
      const field = stepperFields[btn.dataset.stepTarget];
      field.set(Number(field.input.value) + delta);
      persistState();
    });
  });
}

bindRampTab();

function bindPracticeTab() {
  const baseBpm = document.getElementById('practiceBaseBpm');
  const baseBpmRange = document.getElementById('practiceBaseBpmRange');
  const deltaPercent = document.getElementById('practiceDeltaPercent');
  const deltaPercentRange = document.getElementById('practiceDeltaPercentRange');
  const beatsPerPhase = document.getElementById('practiceBeatsPerPhase');
  const breakBeats = document.getElementById('practiceBreakBeats');

  function setBaseBpm(value) {
    state.practice.baseBpm = clampBpm(value);
    baseBpm.value = state.practice.baseBpm;
    baseBpmRange.value = state.practice.baseBpm;
    updateHeroBpm();
  }
  function setDeltaPercent(value) {
    const n = Math.round(Number(value));
    state.practice.deltaPercent = Number.isFinite(n) ? Math.min(90, Math.max(10, n)) : DEFAULT_STATE.practice.deltaPercent;
    deltaPercent.value = state.practice.deltaPercent;
    deltaPercentRange.value = state.practice.deltaPercent;
  }
  function setBeatsPerPhase(value) {
    state.practice.beatsPerPhase = clampPositiveInt(value, DEFAULT_STATE.practice.beatsPerPhase);
    beatsPerPhase.value = state.practice.beatsPerPhase;
  }
  function setBreakBeats(value) {
    state.practice.breakBeats = clampPositiveInt(value, DEFAULT_STATE.practice.breakBeats);
    breakBeats.value = state.practice.breakBeats;
  }

  baseBpm.addEventListener('change', () => { setBaseBpm(baseBpm.value); persistState(); });
  baseBpmRange.addEventListener('input', () => { setBaseBpm(baseBpmRange.value); persistState(); });
  deltaPercent.addEventListener('change', () => { setDeltaPercent(deltaPercent.value); persistState(); });
  deltaPercentRange.addEventListener('input', () => { setDeltaPercent(deltaPercentRange.value); persistState(); });
  beatsPerPhase.addEventListener('change', () => { setBeatsPerPhase(beatsPerPhase.value); persistState(); });
  breakBeats.addEventListener('change', () => { setBreakBeats(breakBeats.value); persistState(); });

  const stepperFields = {
    practiceBaseBpm: { input: baseBpm, set: setBaseBpm },
    practiceDeltaPercent: { input: deltaPercent, set: setDeltaPercent },
    practiceBeatsPerPhase: { input: beatsPerPhase, set: setBeatsPerPhase },
    practiceBreakBeats: { input: breakBeats, set: setBreakBeats },
  };

  document.getElementById('panel-practice').querySelectorAll('.step-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.step);
      const field = stepperFields[btn.dataset.stepTarget];
      field.set(Number(field.input.value) + delta);
      persistState();
    });
  });
}

bindPracticeTab();

refreshAllInputsFromState();
state.topBar.accentPattern = resizeAccentPattern(state.topBar.accentPattern, state.topBar.timeSigNum);
renderBeatDots();
updatePracticeReadout();
</script>
