<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Practice Metronome</title>
<style>
@layer base, components, themes, motion;

@layer base {
  :root {
    color-scheme: dark;

    /* ── Primitives — raw values, named for what they are ── */
    --neutral-975: #0e0e12;
    --neutral-950: #15151a;
    --neutral-900: #1e1e25;
    --neutral-850: #26262f;
    --neutral-800: #2a2a33;
    --neutral-500: #666672;
    --neutral-300: #9ba0a8;
    --neutral-100: #e8e8ec;
    --accent-500:  #f5a623;
    --accent-950:  #1a1305;
    --red-500:     #e5484d;

    /* Reserved surface roles, unthemed. The themed surface/text/accent
       tokens (--bg/--panel/--overlay/--divider/--text/--accent/etc.) are
       not defined here — each :root[data-theme="…"] block in @layer
       themes supplies them, so a theme always wins over this layer
       structurally. --sunken/--inverse remain reserved: nothing shows an
       inset/code area or an inverted block. */
    --sunken:  var(--neutral-975);
    --inverse: var(--neutral-100);

    --radius-lg: 999px;
    --radius-round: 50%;

    /* Shadows — --shadow-md floats the quick-select popup above the panel
       behind it. --shadow-sm/--shadow-lg remain reserved for the day another
       floating element needs a lighter/heavier depth cue. Calibrated with
       higher alpha than a typical light-mode scale, since a shadow needs more
       contrast punch to read against a near-black canvas. */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.4), 0 4px 8px rgba(0, 0, 0, 0.3);

    /* Z-index — --z-overlay lifts the quick-select popup above page content.
       --z-base/--z-raised remain reserved for the day ordinary in-flow
       content needs explicit stacking. */
    --z-base:    0;
    --z-raised:  1;
    --z-overlay: 10;

    /* Motion — owned here permanently; no theme may redefine these four. */
    --duration-instant: 0.05s;
    --duration-fast: 0.15s;
    --duration-moderate: 0.3s;
    --ease-standard: ease;

    /* Type weight */
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    /* Type scale */
    --text-xs:   0.75rem;
    --text-sm:   0.875rem;
    --text-base: 1rem;
    --text-hero: 4.5rem;

    /* Leading */
    --leading-none:   1;
    --leading-normal: 1.45;

    /* Tracking */
    --tracking-tighter: -0.035em;
    --tracking-tight:  -0.02em;
    --tracking-snug:    0.02em;
    --tracking-wide:    0.04em;
    --tracking-wider:   0.12em;
    --tracking-widest:  0.15em;

    /* Spacing scale */
    --space-2xs: 0.5rem;
    --space-xs:  0.75rem;
    --space-sm:  1rem;
    --space-md:  1.25rem;
    --space-lg:  1.5rem;
    --space-xl:  2rem;
    --space-2xl: 2.5rem;
    --space-3xl: 3rem;

    /* Component sizing — dimensions for one specific control, not gaps/margins,
       so deliberately outside the spacing scale above rather than forced onto it. */
    --quick-select-popup-max-height: 12.5rem;
    --quick-select-popup-min-width: 4.5rem;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    max-width: var(--content-max-width);
    margin: var(--space-2xl) auto;
    padding: 0 var(--space-md) var(--space-3xl);
    line-height: var(--leading-normal);
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  input[type="range"]:focus-visible,
  input[type="number"]:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
}

@layer components {

body {
  font-family: var(--font-ui);
}

h1 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--text-muted);
  text-align: center;
  margin: 0 0 var(--space-xl);
}

#masthead {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-xl);
}

#masthead h1 { flex: 1; margin: 0; }

#themeSelect { flex: 0 0 auto; }

#topbar {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-sm) var(--space-lg);
  align-items: end;
  padding-bottom: var(--space-md);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
  font-size: var(--text-xs);
}

#topbar .full {
  grid-column: 1 / -1;
}

#volumeValue {
  font-variant-numeric: tabular-nums;
}

#tabs {
  display: flex;
  gap: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
  margin-bottom: var(--space-lg);
}

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font: inherit;
  font-size: var(--text-base);
  padding: var(--space-xs) var(--space-2xs);
  margin-bottom: -1px;
  cursor: pointer;
  text-align: center;
  border-bottom: 2px solid transparent;
  transition: color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.tab-btn:hover {
  color: var(--text);
  background: var(--panel);
}

.tab-btn:active { transform: scale(0.98); }

.tab-btn.active {
  color: var(--accent);
  font-weight: var(--font-weight-semibold);
  border-bottom-color: var(--accent);
}

.panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  padding-bottom: var(--space-lg);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
}

.panel[hidden] { display: none; }

@media (prefers-reduced-motion: no-preference) {
  .panel:not([hidden]), .readout:not([hidden]) {
    animation: panel-fade-in var(--duration-moderate) var(--ease-standard) both;
  }
}

}

@keyframes panel-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@layer components {

#heroZone {
  text-align: center;
  margin-bottom: var(--space-xl);
}

.hero-frame { position: relative; }

#beatFlash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  #beatFlash { animation: none !important; }
}

#heroBpm {
  position: relative;
  isolation: isolate;
  font-size: var(--text-hero);
  font-weight: var(--font-weight-bold);
  font-family: var(--font-display);
  line-height: var(--leading-none);
  letter-spacing: var(--tracking-tighter);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: no-preference) {
  #heroBpm { animation: hero-enter 400ms var(--ease-standard) both; }
}

}

@keyframes hero-enter {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}

@layer components {

#heroBpm::before {
  content: "";
  position: absolute;
  inset: -2.5rem -3.5rem;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, var(--accent-glow) 0%, transparent 50%);
}

#heroBpmLabel {
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.35rem;
}

label,
.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
  font-size: var(--text-sm);
  color: var(--text-muted);
}

input[type="number"],
select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: var(--space-2xs);
  font: inherit;
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-standard);
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}

input[type="number"]:focus,
select:focus {
  border-color: var(--accent);
}

input[type="number"].clamped {
  border-color: var(--accent-beat);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
}

.tapTempo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: 0 var(--space-md);
  font-size: var(--text-sm);
  font-weight: var(--font-weight-semibold);
  transition: border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.tapTempo:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.tapTempo:active {
  transform: scale(0.94);
}

.stepper-row {
  display: flex;
  gap: var(--space-2xs);
  align-items: stretch;
}

.stepper-row input[type="number"] {
  flex: 1;
  min-width: 0;
}

.step-group {
  display: flex;
  gap: var(--space-2xs);
}

.step-btn {
  flex: 0 0 auto;
  width: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.step-btn.step-5 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

.step-btn:hover {
  background: var(--neutral-850);
  border-color: var(--accent);
  color: var(--accent);
}

.step-btn:active {
  transform: scale(0.94);
}

/* Deliberately its own class, not .step-btn — see Global Constraints:
   bind*Tab()'s querySelectorAll('.step-btn') delegation keys off
   data-step-target, which this button doesn't have. */
.quick-select-toggle {
  flex: 0 0 auto;
  width: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-xs);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.quick-select-toggle:hover {
  background: var(--neutral-850);
  border-color: var(--accent);
  color: var(--accent);
}

.quick-select-toggle:active {
  transform: scale(0.94);
}

.quick-select-toggle[aria-expanded="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

.quick-select-popup {
  position: fixed;
  z-index: var(--z-overlay);
  max-height: var(--quick-select-popup-max-height);
  overflow-y: auto;
  background: var(--overlay);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: var(--space-2xs) 0;
  min-width: var(--quick-select-popup-min-width);
}

.quick-select-option {
  padding: var(--space-2xs) var(--space-sm);
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
}

.quick-select-option:hover {
  background: var(--neutral-850);
  color: var(--text);
}

.quick-select-option.highlighted {
  background: var(--accent);
  color: var(--on-accent);
}

#controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  margin-top: var(--space-2xs);
}

#startStop {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-3xl);
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-snug);
  transition: filter var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

#startStop:hover { filter: brightness(1.08); }
#startStop:active { transform: scale(0.98); }

#beatIndicator {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2xs);
  justify-content: center;
  margin-bottom: var(--space-sm);
}

.beat-dot {
  appearance: none;
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: var(--radius-round);
  background: var(--dot-idle);
  transition:
    background-color var(--dot-decay) var(--dot-ease),
    box-shadow       var(--dot-decay) var(--dot-ease),
    transform        var(--dot-decay) var(--dot-ease),
    filter           var(--duration-fast) var(--ease-standard),
    border-color     var(--duration-fast) var(--ease-standard);
}

.beat-dot.pulse       { background: var(--dot-pulse-bg); transition-duration: var(--dot-strike); }
.beat-dot.pulse.accent{ background: var(--dot-accent-bg); }
.beat-dot.accented    { border-color: var(--accent-beat); }

/* Hover/active only ever match the accent-editor <button> dots, never the
   non-interactive practice-progress <div> dots rendered during Practice
   playback — so the row correctly stops signaling "clickable" the moment
   it stops being clickable. */
button.beat-dot:hover { filter: brightness(1.25); }
button.beat-dot:not(.accented):hover { border-color: var(--accent); }
button.beat-dot:active { transform: scale(0.94); }

/* Group dots in 4s so long rows (practice phases up to 64 beats) stay countable at a glance */
#beatIndicator .beat-dot:nth-child(4n):not(:last-child) {
  margin-right: var(--space-2xs);
}

.readout {
  font-size: var(--text-xs);
  color: var(--text-muted);
  min-height: 1.2em;
  text-align: center;
  text-wrap: pretty;
  font-variant-numeric: tabular-nums;
  margin-top: var(--space-2xs);
}

.phase-segment {
  display: inline-block;
  transition: transform var(--duration-fast) var(--ease-standard), text-shadow var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.phase-segment.active {
  color: var(--accent);
  transform: scale(1.1);
  font-weight: var(--font-weight-semibold);
  text-shadow: 0 0 8px var(--accent);
}

}

@layer themes {

:root[data-theme="classic"] {
  --bg:                #15151a;
  --panel:             #1e1e25;
  --overlay:           #2a2a33;
  --divider:           #2a2a33;
  --text:              #e8e8ec;
  --text-muted:        #9ba0a8;
  --text-dim:          #666672;
  --accent:            #f5a623;
  --accent-beat:       #e5484d;
  --on-accent:         #1a1305;
  --accent-glow:       color-mix(in srgb, var(--accent) 16%, transparent);
  --dot-idle:          #666672;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        0.05s;
  --dot-decay:         0.05s;
  --dot-ease:          ease;
  --content-max-width: 480px;
  --radius:            8px;
  --radius-panel:      8px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-ui);
}

:root[data-theme="classic"] .hero-frame  { display: flex; flex-direction: column; }
:root[data-theme="classic"] #beatIndicator { order: -1; }
:root[data-theme="classic"] #beatFlash   { display: none; }
:root[data-theme="classic"] #masthead h1 { text-align: center; }

:root[data-theme="pulse-engine"] {
  --bg:                #07070a;
  --panel:             #1a1a20;
  --overlay:           #25252d;
  --divider:           #2e2e38;
  --text:              #edeef2;
  --text-muted:        #a2a7b0;
  --text-dim:          #52525e;
  --accent:            #ffab1f;
  --accent-beat:       #ff4b4b;
  --on-accent:         #1a1000;
  --accent-glow:       color-mix(in srgb, var(--accent) 55%, transparent);
  --dot-idle:          #2e2e38;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        30ms;
  --dot-decay:         340ms;
  --dot-ease:          cubic-bezier(0.15, 0.75, 0.3, 1);
  --content-max-width: 500px;
  --radius:            6px;
  --radius-panel:      14px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-mono);

  /* theme-private */
  --chassis: #121217;
  --screen:  #050508;
  --raised:  #1a1a20;
  --key-top: #25252d;
  --sunken:  #0b0b0f;
  --beat-glow: color-mix(in srgb, var(--accent-beat) 55%, transparent);
  --bevel:  inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --recess: inset 0 2px 6px rgba(0, 0, 0, 0.75);
  --lift:   0 10px 26px rgba(0, 0, 0, 0.55);

  /* .step-btn:hover / .quick-select-toggle:hover / .quick-select-option:hover
     (@layer components) read the shared --neutral-850 primitive directly for
     their hover surface — see Global Constraints. Overriding it here, rather
     than editing those locked component rules, is how this theme gets its
     own hover surface. */
  --neutral-850: #25252d;
}

:root[data-theme="pulse-engine"] body {
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #14141b 0%, transparent 60%),
    var(--bg);
}

:root[data-theme="pulse-engine"] h1 {
  font-size: 0.9375rem;
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text);
  padding-bottom: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
}

:root[data-theme="pulse-engine"] #topbar {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-xs) var(--space-md);
  align-items: end;
  padding: var(--space-xs) var(--space-sm) var(--space-sm);
  margin-bottom: var(--space-sm);
  background: var(--chassis);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] #tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin-bottom: var(--space-lg);
  background: var(--sunken);
  border: 1px solid var(--divider);
  border-radius: 10px;
  box-shadow: var(--recess);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .tab-btn {
  flex: 1;
  background: none;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  padding: 0.6rem 0.25rem;
}

:root[data-theme="pulse-engine"] .tab-btn:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

:root[data-theme="pulse-engine"] .tab-btn:active { transform: translateY(1px); }

:root[data-theme="pulse-engine"] .tab-btn.active {
  color: var(--accent);
  background: var(--raised);
  border-color: var(--overlay);
  box-shadow: var(--bevel), 0 2px 5px rgba(0, 0, 0, 0.5);
}

:root[data-theme="pulse-engine"] .hero-frame {
  isolation: isolate;
  padding: var(--space-sm);
  background: linear-gradient(180deg, #20202a 0%, var(--chassis) 55%);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel), var(--lift);
}

<script>
// LOGIC-BEGIN
function clampBpm(bpm) {
  const n = Math.round(Number(bpm));
  if (Number.isNaN(n)) return 120;
  return Math.min(400, Math.max(20, n));
}

function clampBpmPercent(pct) {
  const n = Math.round(Number(pct));
  if (Number.isNaN(n)) return 100;
  return Math.min(150, Math.max(50, n));
}

function computeEffectiveBpm(bpm, percent) {
  return clampBpm(bpm * (percent / 100));
}

function subdivisionCount(subdivision) {
  const table = { none: 1, eighths: 2, triplets: 3, sixteenths: 4 };
  return table[subdivision] || 1;
}

function beatIntervalSeconds(bpm) {
  return 60 / bpm;
}

function subdivisionIntervalSeconds(bpm, subdivision) {
  return beatIntervalSeconds(bpm) / subdivisionCount(subdivision);
}

function isAccentBeat(beatIndexInBar, accentPattern) {
  return Boolean(accentPattern && accentPattern[beatIndexInBar]);
}

function bpmFromTapTimestamps(timestamps) {
  if (!Array.isArray(timestamps) || timestamps.length < 2) return null;
  const diffs = [];
  for (let i = 1; i < timestamps.length; i++) {
    const diff = timestamps[i] - timestamps[i - 1];
    if (diff > 0 && diff <= 2000) diffs.push(diff);
  }
  if (diffs.length === 0) return null;
  const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  return clampBpm(60000 / avg);
}

function inferRampDirection(startBpm, stopBpm) {
  if (startBpm === stopBpm) return null;
  return startBpm < stopBpm ? 'up' : 'down';
}

function computeNextRampBpm(currentBpm, direction, scaleMode, scaleAmount, stopBpm) {
  if (direction === null) return stopBpm;
  const delta = scaleMode === 'percent' ? currentBpm * (scaleAmount / 100) : scaleAmount;
  let next = direction === 'up' ? currentBpm + delta : currentBpm - delta;
  next = direction === 'up' ? Math.min(next, stopBpm) : Math.max(next, stopBpm);
  let rounded = Math.round(next);
  // A tiny step (e.g. 2% of a low BPM) can round back to currentBpm, stalling the
  // ramp forever since beatsIntoStep resets without the tempo ever changing.
  // Force at least a 1-BPM move toward the target, still clamped at stopBpm.
  if (direction === 'up' && rounded <= currentBpm) {
    rounded = Math.min(currentBpm + 1, stopBpm);
  } else if (direction === 'down' && rounded >= currentBpm) {
    rounded = Math.max(currentBpm - 1, stopBpm);
  }
  return rounded;
}

function barsToBeats(bars, timeSigNumerator) {
  return bars * timeSigNumerator;
}

function computeSlowBpm(baseBpm, deltaPercent) {
  return clampBpm(baseBpm * (1 - deltaPercent / 100));
}

function buildPracticePhaseSequence(beatsPerPhase, breakBeats) {
  const seq = [];
  for (let i = 0; i < beatsPerPhase; i++) seq.push('slow');
  for (let i = 0; i < breakBeats; i++) seq.push('break');
  for (let i = 0; i < beatsPerPhase; i++) seq.push('fast');
  for (let i = 0; i < breakBeats; i++) seq.push('break');
  return seq;
}

function bpmForPhase(phase, baseBpm, slowBpm) {
  return phase === 'fast' ? baseBpm : slowBpm;
}

function serializeSettings(state) {
  return JSON.stringify(state);
}

function deserializeSettings(json, defaults) {
  const merged = JSON.parse(JSON.stringify(defaults));
  let parsed;
  try {
    parsed = JSON.parse(json);
  } catch (e) {
    return merged;
  }
  if (!parsed || typeof parsed !== 'object') return merged;
  for (const section of Object.keys(defaults)) {
    if (parsed[section] && typeof parsed[section] === 'object') {
      Object.assign(merged[section], parsed[section]);
    }
  }
  return merged;
}

function clampPositiveInt(value, fallback) {
  const n = Math.round(Number(value));
  if (!Number.isFinite(n) || n < 1) return fallback;
  return n;
}

function wasValueClamped(rawValue, clampedValue, decimals) {
  const n = Number(rawValue);
  if (!Number.isFinite(n)) return true;
  const scale = Math.pow(10, decimals || 0);
  const rounded = Math.round(n * scale) / scale;
  return rounded !== clampedValue;
}

function resizeAccentPattern(pattern, newLength) {
  const result = [];
  for (let i = 0; i < newLength; i++) {
    result.push(Boolean(pattern && pattern[i]));
  }
  return result;
}

function practiceSegmentIndex(sequenceIndex, beatsPerPhase, breakBeats) {
  if (sequenceIndex < beatsPerPhase) return 0;
  if (sequenceIndex < beatsPerPhase + breakBeats) return 1;
  if (sequenceIndex < beatsPerPhase + breakBeats + beatsPerPhase) return 2;
  return 3;
}

function practicePhasePosition(sequenceIndex, beatsPerPhase, breakBeats) {
  if (sequenceIndex < beatsPerPhase) return sequenceIndex;
  if (sequenceIndex < beatsPerPhase + breakBeats) return sequenceIndex - beatsPerPhase;
  if (sequenceIndex < beatsPerPhase + breakBeats + beatsPerPhase) return sequenceIndex - (beatsPerPhase + breakBeats);
  return sequenceIndex - (beatsPerPhase + breakBeats + beatsPerPhase);
}

function buildQuickSelectValues(presets, currentValue) {
  const values = presets.includes(currentValue) ? presets.slice() : presets.concat([currentValue]);
  return values.sort((a, b) => a - b);
}

function resolveTheme(saved, validThemes, fallback) {
  if (!Array.isArray(validThemes)) return fallback;
  return validThemes.includes(saved) ? saved : fallback;
}
// LOGIC-END
</script>
<script>
const DEFAULT_STATE = {
  topBar: { subdivision: 'none', soundStyle: 'click', volume: 80, activeTab: 'metronome', theme: 'classic' },
  metronome: { bpm: 120, percent: 100, timeSigNum: 4, accentPattern: [true, false, false, false] },
  ramp: { startBpm: 80, stopBpm: 140, scaleMode: 'percent', scaleAmount: 2, stepBars: 4, timeSigNum: 4, accentPattern: [true, false, false, false] },
  practice: { baseBpm: 120, deltaPercent: 50, timeSigNum: 4, barsPerPhase: 1, breakBeats: 4, accentPattern: [true, false, false, false] },
};

const STORAGE_KEY = 'guitarMetronomeSettings';
let state = deserializeSettings(localStorage.getItem(STORAGE_KEY), DEFAULT_STATE);
['metronome', 'ramp', 'practice'].forEach((mode) => {
  state[mode].accentPattern = resizeAccentPattern(state[mode].accentPattern, state[mode].timeSigNum);
});

function persistState() {
  localStorage.setItem(STORAGE_KEY, serializeSettings(state));
}

function activeModeState() {
  return state[state.topBar.activeTab];
}

const CLAMP_FLASH_MS = 500;

function flashClamped(inputEl) {
  inputEl.classList.add('clamped');
  clearTimeout(inputEl._clampFlashTimer);
  inputEl._clampFlashTimer = setTimeout(() => inputEl.classList.remove('clamped'), CLAMP_FLASH_MS);
}

function refreshAllInputsFromState() {
  document.getElementById('subdivision').value = state.topBar.subdivision;
  document.getElementById('soundStyle').value = state.topBar.soundStyle;
  document.getElementById('volume').value = state.topBar.volume;
  document.getElementById('volumeValue').textContent = state.topBar.volume + '%';

  document.getElementById('metronomeBpm').value = state.metronome.bpm;
  document.getElementById('metronomeBpmRange').value = state.metronome.bpm;
  document.getElementById('metronomePercent').value = state.metronome.percent;
  document.getElementById('metronomePercentRange').value = state.metronome.percent;
  document.getElementById('metronomeTimeSig').value = state.metronome.timeSigNum;

  document.getElementById('rampStartBpm').value = state.ramp.startBpm;
  document.getElementById('rampStartBpmRange').value = state.ramp.startBpm;
  document.getElementById('rampStopBpm').value = state.ramp.stopBpm;
  document.getElementById('rampStopBpmRange').value = state.ramp.stopBpm;
  document.getElementById('rampScaleMode').value = state.ramp.scaleMode;
  document.getElementById('rampScaleAmount').value = state.ramp.scaleAmount;
  document.getElementById('rampTimeSig').value = state.ramp.timeSigNum;
  document.getElementById('rampStepBars').value = state.ramp.stepBars;

  document.getElementById('practiceBaseBpm').value = state.practice.baseBpm;
  document.getElementById('practiceBaseBpmRange').value = state.practice.baseBpm;
  document.getElementById('practiceDeltaPercent').value = state.practice.deltaPercent;
  document.getElementById('practiceDeltaPercentRange').value = state.practice.deltaPercent;
  document.getElementById('practiceTimeSig').value = state.practice.timeSigNum;
  document.getElementById('practiceBarsPerPhase').value = state.practice.barsPerPhase;
  document.getElementById('practiceBreakBeats').value = state.practice.breakBeats;

  const themeValues = THEMES.map((t) => t.value);
  state.topBar.theme = resolveTheme(state.topBar.theme, themeValues, 'classic');
  applyTheme(state.topBar.theme);
  document.getElementById('themeSelect').value = state.topBar.theme;

  const validTabs = ['metronome', 'ramp', 'practice'];
  const activeTab = validTabs.includes(state.topBar.activeTab) ? state.topBar.activeTab : 'metronome';
  switchTab(activeTab);
}

const THEMES = [
  { value: 'classic',      label: 'Classic' },
  { value: 'pulse-engine', label: 'Pulse Engine' },
];

function applyTheme(name) {
  document.documentElement.dataset.theme = name;
}

function populateThemeSelect() {
  const select = document.getElementById('themeSelect');
  select.innerHTML = '';
  THEMES.forEach((theme) => {
    const option = document.createElement('option');
    option.value = theme.value;
    option.textContent = theme.label;
    select.appendChild(option);
  });
}

function bindTopBar() {
  const subdivision = document.getElementById('subdivision');
  const soundStyle = document.getElementById('soundStyle');
  const volume = document.getElementById('volume');
  const themeSelect = document.getElementById('themeSelect');

  subdivision.addEventListener('change', () => {
    state.topBar.subdivision = subdivision.value;
    persistState();
  });
  soundStyle.addEventListener('change', () => {
    state.topBar.soundStyle = soundStyle.value;
    persistState();
  });
  volume.addEventListener('input', () => {
    state.topBar.volume = Number(volume.value);
    document.getElementById('volumeValue').textContent = state.topBar.volume + '%';
    persistState();
  });
  themeSelect.addEventListener('change', () => {
    state.topBar.theme = themeSelect.value;
    applyTheme(state.topBar.theme);
    persistState();
  });
}

populateThemeSelect();
bindTopBar();

let audioCtx = null;
let isPlaying = false;
let nextNoteTime = 0;
let schedulerTimerId = null;
let beatIndexInBar = 0;

const LOOKAHEAD_MS = 25;
const SCHEDULE_AHEAD_SEC = 0.1;

function ensureAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function soundFrequency(style, accent) {
  const table = {
    click: accent ? 1500 : 1000,
    beep: accent ? 1800 : 1200,
    wood: accent ? 900 : 500,
  };
  return table[style] || table.click;
}

function scheduleClick(time, accent, isSubdivision) {
  const ctx = ensureAudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = state.topBar.soundStyle === 'wood' ? 'triangle' : 'sine';
  osc.frequency.value = soundFrequency(state.topBar.soundStyle, accent);
  const vol = (state.topBar.volume / 100) * (accent ? 1.0 : isSubdivision ? 0.4 : 0.7);
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  osc.start(time);
  osc.stop(time + 0.06);
}

function flashBeatIndicator(beatIndex, accent) {
  triggerBeatFlash(accent);
  const dots = document.getElementById('beatIndicator').children;
  const dot = dots[beatIndex];
  if (!dot) return;
  dot.classList.add('pulse');
  dot.classList.toggle('accent', accent);
  dot.addEventListener('transitionend', () => dot.classList.remove('pulse'), { once: true });
}

function renderBeatDots() {
  const container = document.getElementById('beatIndicator');
  container.removeAttribute('aria-hidden');
  container.innerHTML = '';
  const n = activeModeState().timeSigNum;
  for (let i = 0; i < n; i++) {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'beat-dot';
    dot.addEventListener('click', () => toggleAccent(i));
    container.appendChild(dot);
  }
  updateAccentDotStyles();
}

function renderPracticeProgressDots(count) {
  const container = document.getElementById('beatIndicator');
  container.setAttribute('aria-hidden', 'true');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    dot.className = 'beat-dot';
    container.appendChild(dot);
  }
  // Force a synchronous reflow so the freshly-created dots' resting style is
  // committed before scheduleBeat's immediately-following flashBeatIndicator()
  // call adds .pulse. Without this, a dot created and pulsed in the same tick
  // has no prior committed style to transition from, so no transition starts,
  // transitionend never fires, and the pulse class gets stuck forever on that
  // dot — which always happens to be index 0, the first beat of every segment
  // this function is called for.
  container.offsetHeight;
}

function toggleAccent(index) {
  const mode = activeModeState();
  const pattern = mode.accentPattern.slice();
  pattern[index] = !pattern[index];
  mode.accentPattern = pattern;
  updateAccentDotStyles();
  persistState();
}

function updateAccentDotStyles() {
  const dots = document.getElementById('beatIndicator').children;
  activeModeState().accentPattern.forEach((accented, i) => {
    const dot = dots[i];
    if (!dot) return;
    dot.classList.toggle('accented', accented);
    dot.setAttribute('aria-pressed', String(accented));
    dot.setAttribute('aria-label', `Beat ${i + 1}, ${accented ? 'accented' : 'not accented'}`);
  });
}

let rampRuntime = null;

let practiceRuntime = null;

function currentModeBpm() {
  if (state.topBar.activeTab === 'ramp') {
    return rampRuntime.currentBpm;
  }
  if (state.topBar.activeTab === 'practice') {
    const slowBpm = computeSlowBpm(state.practice.baseBpm, state.practice.deltaPercent);
    return bpmForPhase(practiceRuntime.sequence[practiceRuntime.index], state.practice.baseBpm, slowBpm);
  }
  return computeEffectiveBpm(state.metronome.bpm, state.metronome.percent);
}

function updateRampReadout(explicitDisplay) {
  const display = explicitDisplay !== undefined
    ? explicitDisplay
    : (rampRuntime ? { currentBpm: rampRuntime.currentBpm, direction: rampRuntime.direction } : null);
  if (!display) return;
  document.getElementById('rampReadout').textContent =
    `Current: ${display.currentBpm} BPM` + (display.direction === null ? ' (holding at target)' : '');
}

const PHASE_SEGMENT_LABELS = ['SLOW', 'BREAK', 'FAST', 'BREAK'];
let phaseSegmentSpans = null;

function buildPhaseSegmentSpans() {
  const el = document.getElementById('practiceReadout');
  el.innerHTML = '';
  phaseSegmentSpans = PHASE_SEGMENT_LABELS.map((label, i) => {
    if (i > 0) el.appendChild(document.createTextNode(' – '));
    const span = document.createElement('span');
    span.className = 'phase-segment';
    span.textContent = label;
    el.appendChild(span);
    return span;
  });
}

function updatePracticeReadout(explicitSegment) {
  if (!phaseSegmentSpans) buildPhaseSegmentSpans();
  const activeSegment = explicitSegment !== undefined
    ? explicitSegment
    : (isPlaying && practiceRuntime)
      ? practiceSegmentIndex(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
      : 0;
  phaseSegmentSpans.forEach((span, i) => {
    span.classList.toggle('active', i === activeSegment);
  });
}

function updateHeroBpm(explicitBpm) {
  const el = document.getElementById('heroBpm');
  let bpm = explicitBpm;
  if (bpm === undefined) {
    if (state.topBar.activeTab === 'ramp') {
      bpm = (isPlaying && rampRuntime) ? rampRuntime.currentBpm : clampBpm(state.ramp.startBpm);
    } else if (state.topBar.activeTab === 'practice') {
      if (isPlaying && practiceRuntime) {
        const slowBpm = computeSlowBpm(state.practice.baseBpm, state.practice.deltaPercent);
        bpm = bpmForPhase(practiceRuntime.sequence[practiceRuntime.index], state.practice.baseBpm, slowBpm);
      } else {
        bpm = clampBpm(state.practice.baseBpm);
      }
    } else {
      bpm = computeEffectiveBpm(state.metronome.bpm, state.metronome.percent);
    }
  }
  el.textContent = bpm;
}

function advanceModeAfterBeat() {
  if (state.topBar.activeTab === 'ramp' && rampRuntime) {
    rampRuntime.beatsIntoStep++;
    const beatsPerStep = barsToBeats(state.ramp.stepBars, state.ramp.timeSigNum);
    if (rampRuntime.direction !== null && rampRuntime.beatsIntoStep >= beatsPerStep) {
      rampRuntime.currentBpm = computeNextRampBpm(
        rampRuntime.currentBpm, rampRuntime.direction, state.ramp.scaleMode,
        state.ramp.scaleAmount, state.ramp.stopBpm
      );
      rampRuntime.beatsIntoStep = 0;
      if (rampRuntime.currentBpm === state.ramp.stopBpm) rampRuntime.direction = null;
    }
  } else if (state.topBar.activeTab === 'practice' && practiceRuntime) {
    practiceRuntime.index = (practiceRuntime.index + 1) % practiceRuntime.sequence.length;
  }
}

function scheduleBeat(time) {
  const bpm = currentModeBpm();
  const beatIndex = beatIndexInBar;
  const scheduledTab = state.topBar.activeTab;
  const modeState = state[scheduledTab];
  const isPracticeMode = scheduledTab === 'practice' && practiceRuntime;
  const isPracticeBreak = isPracticeMode && practiceRuntime.sequence[practiceRuntime.index] === 'break';
  const accent = !isPracticeBreak && isAccentBeat(beatIndex, modeState.accentPattern);
  scheduleClick(time, accent, false);

  const subCount = subdivisionCount(state.topBar.subdivision);
  const subInterval = subdivisionIntervalSeconds(bpm, state.topBar.subdivision);
  for (let s = 1; s < subCount; s++) {
    scheduleClick(time + subInterval * s, false, true);
  }

  const rampDisplay = (state.topBar.activeTab === 'ramp' && rampRuntime)
    ? { currentBpm: rampRuntime.currentBpm, direction: rampRuntime.direction }
    : null;
  const practiceSegment = isPracticeMode
    ? practiceSegmentIndex(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
    : null;
  const dotIndex = isPracticeMode
    ? practicePhasePosition(practiceRuntime.index, practiceRuntime.beatsPerPhase, practiceRuntime.breakBeats)
    : beatIndex;
  const dotCount = isPracticeMode
    ? (isPracticeBreak ? practiceRuntime.breakBeats : practiceRuntime.beatsPerPhase)
    : null;
  const dotRuntime = isPracticeMode ? practiceRuntime : null;

  const ctx = ensureAudioContext();
  setTimeout(() => {
    if (!isPlaying || state.topBar.activeTab !== scheduledTab) return;
    if (dotCount !== null && practiceRuntime === dotRuntime
        && document.getElementById('beatIndicator').children.length !== dotCount) {
      renderPracticeProgressDots(dotCount);
    }
    flashBeatIndicator(dotIndex, accent);
    updateHeroBpm(bpm);
    if (rampDisplay) updateRampReadout(rampDisplay);
    if (practiceSegment !== null) updatePracticeReadout(practiceSegment);
  }, Math.max(0, (time - ctx.currentTime) * 1000));

  beatIndexInBar = (beatIndexInBar + 1) % modeState.timeSigNum;
  advanceModeAfterBeat();
  nextNoteTime = time + beatIntervalSeconds(bpm);
}

function schedulerTick() {
  const ctx = ensureAudioContext();
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD_SEC) {
    scheduleBeat(nextNoteTime);
  }
  schedulerTimerId = setTimeout(schedulerTick, LOOKAHEAD_MS);
}

function setTransportState(playing) {
  const btn = document.getElementById('startStop');
  btn.textContent = playing ? 'Stop' : 'Start';
  btn.classList.toggle('is-playing', playing);
  document.body.classList.toggle('playing', playing);
}

function triggerBeatFlash(accent) {
  const flash = document.getElementById('beatFlash');
  if (!flash) return;
  flash.classList.remove('beat', 'beat-accent');
  void flash.offsetWidth;
  flash.classList.add('beat');
  if (accent) flash.classList.add('beat-accent');
}

function startPlayback() {
  if (isPlaying) return;
  const ctx = ensureAudioContext();
  if (ctx.state === 'suspended') ctx.resume();
  isPlaying = true;
  beatIndexInBar = 0;
  nextNoteTime = ctx.currentTime + 0.05;
  if (state.topBar.activeTab === 'ramp') {
    rampRuntime = {
      currentBpm: clampBpm(state.ramp.startBpm),
      direction: inferRampDirection(state.ramp.startBpm, state.ramp.stopBpm),
      beatsIntoStep: 0,
    };
    updateRampReadout();
  }
  if (state.topBar.activeTab === 'practice') {
    const beatsPerPhase = barsToBeats(state.practice.barsPerPhase, state.practice.timeSigNum);
    practiceRuntime = {
      sequence: buildPracticePhaseSequence(beatsPerPhase, state.practice.breakBeats),
      beatsPerPhase: beatsPerPhase,
      breakBeats: state.practice.breakBeats,
      index: 0,
    };
    renderPracticeProgressDots(practiceRuntime.beatsPerPhase);
    updatePracticeReadout();
  }
  schedulerTick();
  setTransportState(true);
}

function stopPlayback() {
  if (!isPlaying) return;
  isPlaying = false;
  clearTimeout(schedulerTimerId);
  setTransportState(false);
  updatePracticeReadout();
  if (state.topBar.activeTab === 'practice') renderBeatDots();
}

document.getElementById('startStop').addEventListener('click', () => {
  if (isPlaying) stopPlayback(); else startPlayback();
});

document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  if (openQuickSelectPopup) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  e.preventDefault();
  if (isPlaying) stopPlayback(); else startPlayback();
});

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn && e.detail !== 0) btn.blur();
});

const QUICK_SELECT_PRESETS = {
  bpm: [40, 60, 80, 100, 120, 140, 160, 180, 200],
  percent: [50, 70, 85, 100, 115, 130],
  deltaPercent: [20, 35, 50, 65, 80],
  scaleAmount: [1, 2, 3, 5, 10],
  timeSig: [2, 3, 4, 5, 6, 8],
  bars: [1, 2, 4, 8],
  breakBeats: [2, 4, 8, 16],
};

let quickSelectIdCounter = 0;
let openQuickSelectPopup = null;

function closeOpenQuickSelectPopup() {
  if (!openQuickSelectPopup) return;
  const { popup, toggle } = openQuickSelectPopup;
  popup.remove();
  toggle.setAttribute('aria-expanded', 'false');
  openQuickSelectPopup = null;
}

document.addEventListener('scroll', (e) => {
  // Deviation from brief: the popup's own scrollIntoView() (in setHighlight,
  // called from openPopup) fires an async 'scroll' event on the popup itself
  // that reaches this capturing listener after openQuickSelectPopup is
  // already assigned, immediately closing the popup that was just opened.
  // Excluding scrolls that originate inside the popup — mirroring the
  // popup.contains(e.target) check the click listener below already uses —
  // fixes this without changing the "close on outside scroll" behavior.
  if (!openQuickSelectPopup) return;
  if (openQuickSelectPopup.popup.contains(e.target)) return;
  closeOpenQuickSelectPopup();
}, true);
window.addEventListener('resize', closeOpenQuickSelectPopup);
document.addEventListener('click', (e) => {
  if (!openQuickSelectPopup) return;
  const { popup, toggle } = openQuickSelectPopup;
  if (e.target === toggle || popup.contains(e.target)) return;
  closeOpenQuickSelectPopup();
});

function attachQuickSelect(inputEl, presets, onSelect) {
  const toggle = document.createElement('button');
  toggle.type = 'button';
  // Not `.step-btn` — see the CSS comment above `.quick-select-toggle`.
  toggle.className = 'quick-select-toggle';
  toggle.setAttribute('aria-haspopup', 'listbox');
  toggle.setAttribute('aria-expanded', 'false');
  const labelEl = document.querySelector(`label[for="${inputEl.id}"]`);
  toggle.setAttribute('aria-label', `Quick-select ${labelEl ? labelEl.textContent.trim() : 'value'}`);
  toggle.textContent = '▾';
  inputEl.insertAdjacentElement('afterend', toggle);

  function openPopup() {
    closeOpenQuickSelectPopup();
    const currentValue = Number(inputEl.value);
    const values = buildQuickSelectValues(presets, currentValue);

    const popup = document.createElement('div');
    popup.className = 'quick-select-popup';
    popup.setAttribute('role', 'listbox');
    popup.tabIndex = -1;

    let highlightedIndex = values.indexOf(currentValue);
    if (highlightedIndex === -1) highlightedIndex = 0;

    const options = values.map((value) => {
      const option = document.createElement('div');
      option.id = `quick-select-option-${quickSelectIdCounter++}`;
      option.className = 'quick-select-option';
      option.setAttribute('role', 'option');
      option.textContent = String(value);
      option.addEventListener('click', () => {
        onSelect(value);
        closeOpenQuickSelectPopup();
        inputEl.focus();
      });
      popup.appendChild(option);
      return option;
    });

    function setHighlight(index) {
      options.forEach((opt, i) => {
        opt.classList.toggle('highlighted', i === index);
        opt.setAttribute('aria-selected', i === index ? 'true' : 'false');
      });
      highlightedIndex = index;
      popup.setAttribute('aria-activedescendant', options[index].id);
      options[index].scrollIntoView({ block: 'center' });
    }

    popup.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setHighlight(Math.min(highlightedIndex + 1, options.length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setHighlight(Math.max(highlightedIndex - 1, 0));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        options[highlightedIndex].click();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeOpenQuickSelectPopup();
        toggle.focus();
      }
    });

    document.body.appendChild(popup);
    const rect = toggle.getBoundingClientRect();
    const popupHeight = popup.offsetHeight;
    const popupWidth = popup.offsetWidth;

    let top = rect.bottom + 4;
    if (top + popupHeight > window.innerHeight) {
      // Not enough room below the toggle — flip to render above it instead.
      top = rect.top - popupHeight - 4;
    }
    top = Math.max(top, 8);
    let left = rect.left;
    if (left + popupWidth > window.innerWidth - 8) {
      left = window.innerWidth - popupWidth - 8;
    }
    left = Math.max(left, 8);
    popup.style.top = top + 'px';
    popup.style.left = left + 'px';

    setHighlight(highlightedIndex);
    toggle.setAttribute('aria-expanded', 'true');
    openQuickSelectPopup = { popup, toggle };
    popup.focus({ preventScroll: true });
  }

  toggle.addEventListener('click', () => {
    if (openQuickSelectPopup && openQuickSelectPopup.toggle === toggle) {
      closeOpenQuickSelectPopup();
    } else {
      openPopup();
    }
  });

  toggle.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      // Stop this from reaching the document-level global Space handler,
      // which would otherwise toggle playback (the toggle button's tagName,
      // 'BUTTON', isn't in that handler's ignore list). Space on an unopened
      // toggle should open the popup, mirroring ArrowDown below.
      e.preventDefault();
      e.stopPropagation();
      if (!openQuickSelectPopup) openPopup();
      return;
    }
    if (e.key === 'ArrowDown' && !openQuickSelectPopup) {
      e.preventDefault();
      openPopup();
    }
  });
}

let tapTimestamps = [];

const BPM_FIELD_MAP = {
  metronomeBpm: { key: 'metronome', prop: 'bpm', updatesHero: true },
  rampStartBpm: { key: 'ramp', prop: 'startBpm', updatesHero: true },
  rampStopBpm: { key: 'ramp', prop: 'stopBpm', updatesHero: false },
  practiceBaseBpm: { key: 'practice', prop: 'baseBpm', updatesHero: true },
};

document.querySelectorAll('.tapTempo').forEach((btn) => {
  const input = btn.previousElementSibling;
  const target = BPM_FIELD_MAP[input.id];

  btn.addEventListener('click', () => {
    const now = Date.now();
    if (tapTimestamps.length > 0 && now - tapTimestamps[tapTimestamps.length - 1] > 2000) {
      tapTimestamps = [];
    }
    tapTimestamps.push(now);
    if (tapTimestamps.length > 8) tapTimestamps = tapTimestamps.slice(-8);

    const bpm = bpmFromTapTimestamps(tapTimestamps);
    if (bpm === null) return;

    state[target.key][target.prop] = bpm;
    input.value = bpm;
    const range = document.getElementById(input.id + 'Range');
    if (range) range.value = bpm;
    if (target.updatesHero) updateHeroBpm();
    persistState();
  });
});

function switchTab(tabName) {
  if (isPlaying) stopPlayback();
  state.topBar.activeTab = tabName;
  persistState();

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  document.getElementById('panel-metronome').hidden = tabName !== 'metronome';
  document.getElementById('panel-ramp').hidden = tabName !== 'ramp';
  document.getElementById('panel-practice').hidden = tabName !== 'practice';
  document.getElementById('rampReadout').hidden = tabName !== 'ramp';
  document.getElementById('practiceReadout').hidden = tabName !== 'practice';
  renderBeatDots();
  updateHeroBpm();
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
