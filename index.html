<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Practice Metronome</title>
<style>
@layer base, components, themes, motion;

@layer base {
  :root {
    color-scheme: dark;

    /* ── Primitives — raw values, named for what they are ── */
    --neutral-975: #0e0e12;
    --neutral-950: #15151a;
    --neutral-900: #1e1e25;
    --neutral-850: #26262f;
    --neutral-800: #2a2a33;
    --neutral-500: #666672;
    --neutral-300: #9ba0a8;
    --neutral-100: #e8e8ec;
    --accent-500:  #f5a623;
    --accent-950:  #1a1305;
    --red-500:     #e5484d;

    /* Reserved surface roles, unthemed. The themed surface/text/accent
       tokens (--bg/--panel/--overlay/--divider/--text/--accent/etc.) are
       not defined here — each :root[data-theme="…"] block in @layer
       themes supplies them, so a theme always wins over this layer
       structurally. --sunken/--inverse remain reserved: nothing shows an
       inset/code area or an inverted block. */
    --sunken:  var(--neutral-975);
    --inverse: var(--neutral-100);

    --radius-lg: 999px;
    --radius-round: 50%;

    /* Shadows — --shadow-md floats the quick-select popup above the panel
       behind it. --shadow-sm/--shadow-lg remain reserved for the day another
       floating element needs a lighter/heavier depth cue. Calibrated with
       higher alpha than a typical light-mode scale, since a shadow needs more
       contrast punch to read against a near-black canvas. */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 10px 20px rgba(0, 0, 0, 0.4), 0 4px 8px rgba(0, 0, 0, 0.3);

    /* Z-index — --z-overlay lifts the quick-select popup above page content.
       --z-base/--z-raised remain reserved for the day ordinary in-flow
       content needs explicit stacking. */
    --z-base:    0;
    --z-raised:  1;
    --z-overlay: 10;

    /* Motion — owned here permanently; no theme may redefine these four. */
    --duration-instant: 0.05s;
    --duration-fast: 0.15s;
    --duration-moderate: 0.3s;
    --ease-standard: ease;

    /* Type weight */
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    /* Type scale */
    --text-xs:   0.75rem;
    --text-sm:   0.875rem;
    --text-base: 1rem;
    --text-hero: 4.5rem;

    /* Leading */
    --leading-none:   1;
    --leading-normal: 1.45;

    /* Tracking */
    --tracking-tighter: -0.035em;
    --tracking-tight:  -0.02em;
    --tracking-snug:    0.02em;
    --tracking-wide:    0.04em;
    --tracking-wider:   0.12em;
    --tracking-widest:  0.15em;

    /* Spacing scale */
    --space-2xs: 0.5rem;
    --space-xs:  0.75rem;
    --space-sm:  1rem;
    --space-md:  1.25rem;
    --space-lg:  1.5rem;
    --space-xl:  2rem;
    --space-2xl: 2.5rem;
    --space-3xl: 3rem;

    /* Component sizing — dimensions for one specific control, not gaps/margins,
       so deliberately outside the spacing scale above rather than forced onto it. */
    --quick-select-popup-max-height: 12.5rem;
    --quick-select-popup-min-width: 4.5rem;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    max-width: var(--content-max-width);
    margin: var(--space-2xl) auto;
    padding: 0 var(--space-md) var(--space-3xl);
    line-height: var(--leading-normal);
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  input[type="range"]:focus-visible,
  input[type="number"]:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
}

@layer components {

body {
  font-family: var(--font-ui);
}

h1 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--text-muted);
  text-align: center;
  margin: 0 0 var(--space-xl);
}

#masthead {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-xl);
}

#masthead h1 { flex: 1; margin: 0; }

#themeSelect { flex: 0 0 auto; }

#topbar {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-sm) var(--space-lg);
  align-items: end;
  padding-bottom: var(--space-md);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
  font-size: var(--text-xs);
}

#topbar .full {
  grid-column: 1 / -1;
}

#volumeValue {
  font-variant-numeric: tabular-nums;
}

#tabs {
  display: flex;
  gap: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
  margin-bottom: var(--space-lg);
}

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  font: inherit;
  font-size: var(--text-base);
  padding: var(--space-xs) var(--space-2xs);
  margin-bottom: -1px;
  cursor: pointer;
  text-align: center;
  border-bottom: 2px solid transparent;
  transition: color var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.tab-btn:hover {
  color: var(--text);
  background: var(--panel);
}

.tab-btn:active { transform: scale(0.98); }

.tab-btn.active {
  color: var(--accent);
  font-weight: var(--font-weight-semibold);
  border-bottom-color: var(--accent);
}

.panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  padding-bottom: var(--space-lg);
  margin-bottom: var(--space-lg);
  border-bottom: 1px solid var(--divider);
}

.panel[hidden] { display: none; }

@media (prefers-reduced-motion: no-preference) {
  .panel:not([hidden]), .readout:not([hidden]) {
    animation: panel-fade-in var(--duration-moderate) var(--ease-standard) both;
  }
}

}

@keyframes panel-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@layer components {

#heroZone {
  text-align: center;
  margin-bottom: var(--space-xl);
}

.hero-frame { position: relative; }

#beatFlash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
}

@media (prefers-reduced-motion: reduce) {
  #beatFlash { animation: none !important; }
}

#heroBpm {
  position: relative;
  isolation: isolate;
  font-size: var(--text-hero);
  font-weight: var(--font-weight-bold);
  font-family: var(--font-display);
  line-height: var(--leading-none);
  letter-spacing: var(--tracking-tighter);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: no-preference) {
  #heroBpm { animation: hero-enter 400ms var(--ease-standard) both; }
}

}

@keyframes hero-enter {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}

@layer components {

#heroBpmLabel {
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-widest);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.35rem;
}

label,
.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2xs);
  font-size: var(--text-sm);
  color: var(--text-muted);
}

input[type="number"],
select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: var(--space-2xs);
  font: inherit;
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-standard);
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}

input[type="number"]:focus,
select:focus {
  border-color: var(--accent);
}

input[type="number"].clamped {
  border-color: var(--accent-beat);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
  outline: none;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: var(--radius-round);
  background: var(--accent);
  border: none;
  cursor: pointer;
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: var(--radius-round);
  background: var(--divider);
}

.tapTempo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  padding: 0 var(--space-md);
  font-size: var(--text-sm);
  font-weight: var(--font-weight-semibold);
  transition: border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.tapTempo:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.tapTempo:active {
  transform: scale(0.94);
}

.stepper-row {
  display: flex;
  gap: var(--space-2xs);
  align-items: stretch;
}

.stepper-row input[type="number"] {
  flex: 1;
  min-width: 0;
}

.step-group {
  display: flex;
  gap: var(--space-2xs);
}

.step-btn {
  flex: 0 0 auto;
  width: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.step-btn.step-5 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

.step-btn:hover {
  background: var(--neutral-850);
  border-color: var(--accent);
  color: var(--accent);
}

.step-btn:active {
  transform: scale(0.94);
}

/* Deliberately its own class, not .step-btn — see Global Constraints:
   bind*Tab()'s querySelectorAll('.step-btn') delegation keys off
   data-step-target, which this button doesn't have. */
.quick-select-toggle {
  flex: 0 0 auto;
  width: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  font: inherit;
  font-size: var(--text-xs);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

.quick-select-toggle:hover {
  background: var(--neutral-850);
  border-color: var(--accent);
  color: var(--accent);
}

.quick-select-toggle:active {
  transform: scale(0.94);
}

.quick-select-toggle[aria-expanded="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

.quick-select-popup {
  position: fixed;
  z-index: var(--z-overlay);
  max-height: var(--quick-select-popup-max-height);
  overflow-y: auto;
  background: var(--overlay);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: var(--space-2xs) 0;
  min-width: var(--quick-select-popup-min-width);
}

.quick-select-option {
  padding: var(--space-2xs) var(--space-sm);
  font-size: var(--text-base);
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
}

.quick-select-option:hover {
  background: var(--neutral-850);
  color: var(--text);
}

.quick-select-option.highlighted {
  background: var(--accent);
  color: var(--on-accent);
}

#controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  margin-top: var(--space-2xs);
}

#startStop {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-3xl);
  font-size: var(--text-base);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-snug);
  transition: filter var(--duration-fast) var(--ease-standard), transform var(--duration-instant) var(--ease-standard);
}

#startStop:hover { filter: brightness(1.08); }
#startStop:active { transform: scale(0.98); }

#beatIndicator {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2xs);
  justify-content: center;
  margin-bottom: var(--space-sm);
}

.beat-dot {
  appearance: none;
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: var(--radius-round);
  background: var(--dot-idle);
  transition:
    background-color var(--dot-decay) var(--dot-ease),
    box-shadow       var(--dot-decay) var(--dot-ease),
    transform        var(--dot-decay) var(--dot-ease),
    filter           var(--duration-fast) var(--ease-standard),
    border-color     var(--duration-fast) var(--ease-standard);
}

.beat-dot.pulse       { background: var(--dot-pulse-bg); transition-duration: var(--dot-strike); }
.beat-dot.pulse.accent{ background: var(--dot-accent-bg); }

/* Group dots in 4s so long rows (practice phases up to 64 beats) stay countable at a glance */
#beatIndicator .beat-dot:nth-child(4n):not(:last-child) {
  margin-right: var(--space-2xs);
}

.readout {
  font-size: var(--text-xs);
  color: var(--text-muted);
  min-height: 1.2em;
  text-align: center;
  text-wrap: pretty;
  font-variant-numeric: tabular-nums;
  margin-top: var(--space-2xs);
}

.phase-segment {
  display: inline-block;
  transition: transform var(--duration-fast) var(--ease-standard), text-shadow var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.phase-segment.active {
  color: var(--accent);
  transform: scale(1.1);
  font-weight: var(--font-weight-semibold);
  text-shadow: 0 0 8px var(--accent);
}

}

@layer components {
  /* Sizing for the editor's own controls, deliberately outside the shared
     spacing scale for the same reason --quick-select-popup-* is: these are
     dimensions of one specific control, not gaps between things. */
  #patternEditor {
    /* 26px, not the 44px touch guideline. Adjacent grid cells cannot reach 44
       without their hit areas overlapping their neighbours, which trades a
       small target for a wrong one. 26px plus a 4px gap is the largest target
       that stays honest; the keyboard path added in Task 8 is the real
       accommodation for anyone who cannot hit it. */
    --pattern-slot-size: 26px;
    --pattern-slot-size-compact: 10px;
    --pattern-grid-max-height: 40vh;

    border: 1px solid var(--divider);
    border-radius: var(--radius-panel);
    padding: var(--space-sm);
    margin-bottom: var(--space-sm);
    background: var(--panel);
  }

  #patternHeader {
    display: flex;
    gap: var(--space-sm);
    align-items: flex-end;
    flex-wrap: wrap;
  }

  .pattern-field { margin-bottom: 0; }

  #patternMeta {
    display: flex;
    align-items: center;
    gap: var(--space-2xs);
    margin-left: auto;
    font-size: var(--text-xs);
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  #patternToggle {
    font: inherit;
    font-weight: var(--font-weight-semibold);
    color: var(--text-muted);
    background: none;
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    padding: var(--space-2xs) var(--space-xs);
    cursor: pointer;
    transition: color var(--duration-fast) var(--ease-standard),
                border-color var(--duration-fast) var(--ease-standard);
  }

  #patternToggle:hover { color: var(--text); border-color: var(--accent); }

  /* An author display value beats the UA sheet's [hidden] { display: none },
     so the collapse silently does nothing without this rule. The project
     already hit this once: see .panel[hidden]. */
  #patternBody[hidden] { display: none; }

  #patternGrid {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: var(--space-sm);
    max-height: var(--pattern-grid-max-height);
    overflow: auto;
  }

  .pattern-row {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: var(--radius);
    padding: 2px;
  }

  .pattern-beat-number {
    width: 1.5rem;
    flex: none;
    text-align: right;
    padding-right: var(--space-2xs);
    font-size: var(--text-xs);
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  /* Deliberately NOT .beat-dot: the components layer locks that class's
     transition and five themes restate its states. A slot is a different
     control with a different lifecycle and must not inherit either. */
  .pattern-slot {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: var(--pattern-slot-size);
    height: var(--pattern-slot-size);
    padding: 0;
    border: 1px solid var(--divider);
    /* Deliberately NOT var(--radius): each theme scales that token for inputs
       and buttons, from 3px to 10px, and 10px on a 26px cell is a pill. A cell
       radius wants to stay a cell radius, and varying it against the section's
       --radius-panel is the point. */
    border-radius: 3px;
    background: var(--overlay);
    cursor: pointer;
    position: relative;
    transition: border-color var(--duration-fast) var(--ease-standard),
                background-color var(--duration-fast) var(--ease-standard);
  }

  /* The inner mark carries the level, so the four levels differ in fill size
     as well as colour and stay distinguishable without colour vision. */
  .pattern-slot::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 2px;
    width: 0;
    height: 0;
    background: var(--text);
  }

  .pattern-slot.level-muted {
    background: transparent;
    border-style: dashed;
    opacity: 0.5;
  }

  .pattern-slot.level-quiet::after  { width: 6px;  height: 6px;  background: var(--text-dim); }
  .pattern-slot.level-normal::after { width: 11px; height: 11px; background: var(--text); }

  /* Border and fill carry the accent, and no third signal. An earlier draft
     also tinted the background with --accent-glow, which Pulse Engine defines
     at 55% accent — three accent cues on one 26px cell, blocking nearly solid
     and spending the accent budget on a control that repeats up to 4096 times. */
  .pattern-slot.level-accent { border-color: var(--accent); }
  .pattern-slot.level-accent::after { width: 16px; height: 16px; background: var(--accent); }

  .pattern-slot.beat-start { border-color: var(--text-dim); }

  .pattern-slot:hover { border-color: var(--accent); }

  /* Playhead. Applied and removed from an animation frame, never from a
     transitionend listener, so it cannot get stuck the way .pulse once did. */
  .pattern-slot.playhead { box-shadow: 0 0 0 2px var(--accent), 0 0 12px var(--accent-glow); }

  /* Not var(--overlay): in Classic that token is the slot's own background and
     the section's border colour, all three #2a2a33, so the row highlight would
     be invisible against the very cells it is meant to group. */
  .pattern-row.playhead-row { background: color-mix(in srgb, var(--accent) 10%, transparent); }

  /* While playing, everything but the sounding slot recedes so the playhead
     reads at a glance. The grid stays fully interactive — this is a reading
     emphasis, not a disabled state. body.playing is already toggled by
     setTransportState. */
  body.playing .pattern-slot:not(.playhead) { opacity: 0.7; }
  body.playing .pattern-slot.level-muted:not(.playhead) { opacity: 0.35; }

  #patternGrid.compact { gap: 2px; }
  #patternGrid.compact .pattern-row { gap: 2px; }
  #patternGrid.compact .pattern-slot {
    width: var(--pattern-slot-size-compact);
    height: var(--pattern-slot-size-compact);
    border-radius: 2px;
  }
  #patternGrid.compact .pattern-slot.level-quiet::after  { width: 3px; height: 3px; }
  #patternGrid.compact .pattern-slot.level-normal::after { width: 5px; height: 5px; }
  #patternGrid.compact .pattern-slot.level-accent::after { width: 6px; height: 6px; }
  #patternGrid.compact .pattern-beat-number { width: 1.1rem; }

  /* The legend is the only thing that teaches four fill sizes. It sits inside
     the collapsible body so it disappears with the grid it explains. */
  #patternLegend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-sm);
    margin-top: var(--space-sm);
    padding-top: var(--space-xs);
    border-top: 1px solid var(--divider);
    font-size: var(--text-xs);
    color: var(--text-muted);
  }

  #patternLegend > span {
    display: flex;
    align-items: center;
    gap: var(--space-2xs);
  }

  #patternHint { margin-left: auto; color: var(--text-dim); }

  .pattern-swatch {
    width: 14px;
    height: 14px;
    flex: none;
    border: 1px solid var(--divider);
    border-radius: 3px;
    background: var(--overlay);
    position: relative;
  }

  .pattern-swatch::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    border-radius: 2px;
    width: 0;
    height: 0;
  }

  .pattern-swatch.level-muted { background: transparent; border-style: dashed; opacity: 0.5; }
  .pattern-swatch.level-quiet::after  { width: 4px; height: 4px; background: var(--text-dim); }
  .pattern-swatch.level-normal::after { width: 7px; height: 7px; background: var(--text); }
  .pattern-swatch.level-accent { border-color: var(--accent); }
  .pattern-swatch.level-accent::after { width: 9px; height: 9px; background: var(--accent); }
}

@layer themes {

:root[data-theme="classic"] {
  --bg:                #15151a;
  --panel:             #1e1e25;
  --overlay:           #2a2a33;
  --divider:           #2a2a33;
  --text:              #e8e8ec;
  --text-muted:        #9ba0a8;
  --text-dim:          #666672;
  --accent:            #f5a623;
  --accent-beat:       #e5484d;
  --on-accent:         #1a1305;
  --accent-glow:       color-mix(in srgb, var(--accent) 16%, transparent);
  --dot-idle:          #666672;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        0.05s;
  --dot-decay:         0.05s;
  --dot-ease:          ease;
  --content-max-width: 480px;
  --radius:            8px;
  --radius-panel:      8px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-ui);
}

:root[data-theme="classic"] .hero-frame  { display: flex; flex-direction: column; }
:root[data-theme="classic"] #beatIndicator { order: -1; }
:root[data-theme="classic"] #beatFlash   { display: none; }
:root[data-theme="classic"] #masthead h1 { text-align: center; }

/* Classic-only signature detail: an ambient glow behind the hero numeral.
   Originally unscoped in @layer components, which wrongly bloomed every
   theme's numeral (invisible in Pulse Engine only because its .hero-readout
   clips overflow) — moved here, theme-scoped, same declarations. */
:root[data-theme="classic"] #heroBpm::before {
  content: "";
  position: absolute;
  inset: -2.5rem -3.5rem;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, var(--accent-glow) 0%, transparent 50%);
}

:root[data-theme="pulse-engine"] {
  --bg:                #07070a;
  --panel:             #1a1a20;
  --overlay:           #25252d;
  --divider:           #2e2e38;
  --text:              #edeef2;
  --text-muted:        #a2a7b0;
  --text-dim:          #52525e;
  --accent:            #ffab1f;
  --accent-beat:       #ff4b4b;
  --on-accent:         #1a1000;
  --accent-glow:       color-mix(in srgb, var(--accent) 55%, transparent);
  --dot-idle:          #2e2e38;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        30ms;
  --dot-decay:         340ms;
  --dot-ease:          cubic-bezier(0.15, 0.75, 0.3, 1);
  --content-max-width: 500px;
  --radius:            6px;
  --radius-panel:      14px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-mono);

  /* theme-private */
  --chassis: #121217;
  --screen:  #050508;
  --raised:  #1a1a20;
  --key-top: #25252d;
  --sunken:  #0b0b0f;
  --beat-glow: color-mix(in srgb, var(--accent-beat) 55%, transparent);
  --bevel:  inset 0 1px 0 rgba(255, 255, 255, 0.07);
  --recess: inset 0 2px 6px rgba(0, 0, 0, 0.75);
  --lift:   0 10px 26px rgba(0, 0, 0, 0.55);

  /* .step-btn:hover / .quick-select-toggle:hover / .quick-select-option:hover
     (@layer components) read the shared --neutral-850 primitive directly for
     their hover surface — see Global Constraints. Overriding it here, rather
     than editing those locked component rules, is how this theme gets its
     own hover surface. */
  --neutral-850: #25252d;
}

:root[data-theme="pulse-engine"] body {
  background:
    radial-gradient(ellipse 120% 80% at 50% -10%, #14141b 0%, transparent 60%),
    var(--bg);
}

:root[data-theme="pulse-engine"] h1 {
  font-size: 0.9375rem;
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text);
  padding-bottom: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
}

:root[data-theme="pulse-engine"] #topbar {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-xs) var(--space-md);
  align-items: end;
  padding: var(--space-xs) var(--space-sm) var(--space-sm);
  margin-bottom: var(--space-sm);
  background: var(--chassis);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] #tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin-bottom: var(--space-lg);
  background: var(--sunken);
  border: 1px solid var(--divider);
  border-radius: 10px;
  box-shadow: var(--recess);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .tab-btn {
  flex: 1;
  background: none;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text-muted);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  padding: 0.6rem 0.25rem;
}

:root[data-theme="pulse-engine"] .tab-btn:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

:root[data-theme="pulse-engine"] .tab-btn:active { transform: translateY(1px); }

:root[data-theme="pulse-engine"] .tab-btn.active {
  color: var(--accent);
  background: var(--raised);
  border-color: var(--overlay);
  box-shadow: var(--bevel), 0 2px 5px rgba(0, 0, 0, 0.5);
}

:root[data-theme="pulse-engine"] .hero-frame {
  isolation: isolate;
  padding: var(--space-sm);
  background: linear-gradient(180deg, #20202a 0%, var(--chassis) 55%);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel), var(--lift);
}

:root[data-theme="pulse-engine"] .hero-readout {
  position: relative;
  overflow: hidden;
  padding: var(--space-md) var(--space-sm) var(--space-xs);
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 9px;
  box-shadow: var(--recess), inset 0 0 40px -12px var(--accent-glow);
  text-align: center;
}

:root[data-theme="pulse-engine"] .hero-readout::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.022) 0 1px,
    transparent 1px 3px
  );
}

:root[data-theme="pulse-engine"] #beatFlash {
  z-index: 2;
  border-radius: var(--radius-panel);
  box-shadow: inset 0 0 0 1px var(--accent), inset 0 0 26px -8px var(--accent);
}

:root[data-theme="pulse-engine"] #beatFlash.beat { animation: pulse-engine-shell-strike 240ms ease-out; }

:root[data-theme="pulse-engine"] #beatFlash.beat.beat-accent {
  animation-duration: 400ms;
  box-shadow: inset 0 0 0 2px var(--accent-beat), inset 0 0 34px -8px var(--accent-beat);
}

:root[data-theme="pulse-engine"] #heroBpm {
  font-size: clamp(3.75rem, 17vw, 5.5rem);
  text-shadow: 0 0 26px var(--accent-glow);
}

:root[data-theme="pulse-engine"] #heroBpmLabel {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 0.35em;
  text-indent: 0.35em;
  color: color-mix(in srgb, var(--accent) 55%, var(--text-dim));
  margin-top: 0.4rem;
}

:root[data-theme="pulse-engine"] .hero-frame #beatIndicator {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  align-content: flex-end;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  margin-top: var(--space-sm);
  padding: var(--space-2xs) var(--space-xs);
  background: var(--sunken);
  border: 1px solid #000;
  border-radius: 9px;
  box-shadow: var(--recess);
}

:root[data-theme="pulse-engine"] .beat-dot {
  width: 20px;
  height: 42px;
  border: none;
  border-radius: 2px;
  transform-origin: bottom center;
  box-shadow: var(--bevel);
}

:root[data-theme="pulse-engine"] .beat-dot.pulse {
  box-shadow: 0 0 20px -2px var(--accent-glow), var(--bevel);
  transform: scaleY(1.1);
}

:root[data-theme="pulse-engine"] .beat-dot.pulse.accent {
  box-shadow: 0 0 24px -2px var(--beat-glow), var(--bevel);
  transform: scaleY(1.2);
}

:root[data-theme="pulse-engine"] .readout {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  min-height: 1.4em;
  margin-top: var(--space-sm);
}

:root[data-theme="pulse-engine"] .phase-segment {
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  color: var(--text-dim);
  transition: color var(--duration-fast) var(--ease-standard),
              background-color var(--duration-fast) var(--ease-standard),
              border-color var(--duration-fast) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .phase-segment.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: var(--font-weight-bold);
}

:root[data-theme="pulse-engine"] .panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  padding: var(--space-sm);
  margin-bottom: var(--space-md);
  background: var(--chassis);
  border: 1px solid var(--divider);
  border-radius: var(--radius-panel);
  box-shadow: var(--bevel);
  transition: filter var(--duration-moderate) var(--ease-standard),
              opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="pulse-engine"] .panel[hidden] { display: none; }

:root[data-theme="pulse-engine"] body.playing #topbar,
:root[data-theme="pulse-engine"] body.playing #tabs,
:root[data-theme="pulse-engine"] body.playing .panel {
  filter: grayscale(0.9);
  opacity: 0.82;
}

:root[data-theme="pulse-engine"] body.playing #topbar:hover,
:root[data-theme="pulse-engine"] body.playing #tabs:hover,
:root[data-theme="pulse-engine"] body.playing .panel:hover,
:root[data-theme="pulse-engine"] body.playing #topbar:focus-within,
:root[data-theme="pulse-engine"] body.playing #tabs:focus-within,
:root[data-theme="pulse-engine"] body.playing .panel:focus-within {
  filter: none;
  opacity: 1;
}

:root[data-theme="pulse-engine"] label,
:root[data-theme="pulse-engine"] .field-group {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
}

/* Only the Volume row's label has a nested <span> (for the "80%" readout);
   every other label is plain text, so this stays scoped to that one row.
   Classic deliberately has no equivalent rule and keeps "Volume 80%" inline. */
:root[data-theme="pulse-engine"] label > span {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2xs);
}

:root[data-theme="pulse-engine"] #volumeValue {
  font-family: var(--font-mono);
  color: var(--text);
}

:root[data-theme="pulse-engine"] input[type="number"],
:root[data-theme="pulse-engine"] select {
  background: var(--screen);
  border: 1px solid #000;
  padding: 0.5rem 0.55rem;
  font-family: var(--font-mono);
  font-weight: var(--font-weight-semibold);
  box-shadow: var(--recess);
}

:root[data-theme="pulse-engine"] input[type="number"]:focus,
:root[data-theme="pulse-engine"] select:focus {
  border-color: var(--accent);
  box-shadow: var(--recess), 0 0 0 1px var(--accent);
}

:root[data-theme="pulse-engine"] input[type="number"].clamped {
  border-color: var(--accent-beat);
  box-shadow: var(--recess), 0 0 0 1px var(--accent-beat);
}

:root[data-theme="pulse-engine"] input[type="range"] {
  height: 6px;
  border-radius: 3px;
  background: var(--screen);
  box-shadow: var(--recess);
}

:root[data-theme="pulse-engine"] input[type="range"]::-webkit-slider-thumb {
  width: 22px;
  height: 22px;
  background: linear-gradient(180deg, #3a3a46 0%, #1e1e26 100%);
  border: 1px solid #000;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 5px rgba(0, 0, 0, 0.6);
}

:root[data-theme="pulse-engine"] input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  background: linear-gradient(180deg, #3a3a46 0%, #1e1e26 100%);
  border: 1px solid #000;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 5px rgba(0, 0, 0, 0.6);
}

:root[data-theme="pulse-engine"] input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: var(--screen);
}

:root[data-theme="pulse-engine"] .step-btn,
:root[data-theme="pulse-engine"] .tapTempo,
:root[data-theme="pulse-engine"] .quick-select-toggle {
  background: linear-gradient(180deg, var(--overlay) 0%, var(--raised) 100%);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  box-shadow: var(--bevel), 0 1px 2px rgba(0, 0, 0, 0.6);
}

:root[data-theme="pulse-engine"] .step-btn { width: 2.3rem; }
:root[data-theme="pulse-engine"] .step-btn.step-5 { font-size: var(--text-xs); font-weight: var(--font-weight-bold); }

:root[data-theme="pulse-engine"] .tapTempo {
  padding: 0 var(--space-md);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
}

:root[data-theme="pulse-engine"] .quick-select-toggle { width: 1.7rem; font-size: var(--text-xs); }

:root[data-theme="pulse-engine"] .quick-select-toggle[aria-expanded="true"] {
  color: var(--accent);
  border-color: var(--accent);
}

:root[data-theme="pulse-engine"] .quick-select-popup {
  border: 1px solid var(--divider);
  border-radius: 8px;
  box-shadow: var(--bevel), var(--shadow-md);
  padding: 4px;
}

:root[data-theme="pulse-engine"] .quick-select-option {
  border-radius: 4px;
  font-family: var(--font-mono);
}

:root[data-theme="pulse-engine"] .quick-select-option.highlighted {
  font-weight: var(--font-weight-bold);
}

:root[data-theme="pulse-engine"] #controls {
  margin-top: var(--space-lg);
}

:root[data-theme="pulse-engine"] #startStop {
  position: relative;
  width: 108px;
  height: 108px;
  border-radius: var(--radius-round);
  background: var(--accent);
  color: var(--on-accent);
  border: 1px solid rgba(0, 0, 0, 0.5);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35),
              inset 0 -3px 8px rgba(0, 0, 0, 0.25),
              0 8px 22px rgba(0, 0, 0, 0.5),
              0 0 34px -10px var(--accent-glow);
  transition: background-color var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-fast) var(--ease-standard),
              filter var(--duration-fast) var(--ease-standard),
              transform var(--duration-instant) var(--ease-standard);
}

:root[data-theme="pulse-engine"] #startStop:hover { filter: brightness(1.06); }

:root[data-theme="pulse-engine"] #startStop:active {
  transform: translateY(2px) scale(0.98);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4), 0 3px 10px rgba(0, 0, 0, 0.5);
}

:root[data-theme="pulse-engine"] #startStop.is-playing {
  background: var(--accent-beat);
  color: #fff;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3),
              inset 0 -3px 8px rgba(0, 0, 0, 0.3),
              0 8px 22px rgba(0, 0, 0, 0.5),
              0 0 38px -10px var(--beat-glow);
}

:root[data-theme="pulse-engine"] #startStop.is-playing::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: var(--radius-round);
  border: 1px solid var(--accent-beat);
  opacity: 0.45;
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  :root[data-theme="pulse-engine"] #startStop.is-playing::after {
    animation: pulse-engine-transport-ring 1.8s ease-in-out infinite;
  }
}

:root[data-theme="kinetic-type"] {
  --bg:                #08080a;
  --panel:             #0f0f12;
  --overlay:           #1e1e23;
  --divider:           #2a2a31;
  --text:              #f4f4f7;
  --text-muted:        #8b8b96;
  --text-dim:          #4c4c57;
  --accent:            #ffb02e;
  --accent-beat:       #ff5252;
  --on-accent:         #150d00;
  --accent-glow:       color-mix(in srgb, var(--accent) 45%, transparent);
  --dot-idle:          #2a2a31;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        30ms;
  --dot-decay:         400ms;
  --dot-ease:          cubic-bezier(0.1, 0.8, 0.25, 1);
  --content-max-width: 640px;
  --radius:            3px;
  --radius-panel:      0;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-ui);

  /* theme-private */
  --ink:        #f4f4f7;
  --rule-faint: #1a1a1f;

  /* .step-btn:hover / .quick-select-toggle:hover / .quick-select-option:hover
     (@layer components) read the shared --neutral-850 primitive directly for
     their hover surface — see Global Constraints. Overriding it here, rather
     than editing those locked component rules, is how the popup option gets
     its own hover surface (matches the source experiment's --neutral-800).
     --neutral-900 is a second, unused-elsewhere base primitive repurposed
     here for the darker inline-control hover/focus surface (the source
     experiment's --neutral-900) — distinct from the popup's lighter one. */
  --neutral-850: #2a2a31;
  --neutral-900: #16161a;
}

:root[data-theme="kinetic-type"] h1 {
  display: flex;
  align-items: baseline;
  gap: var(--space-2xs);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--text);
}

:root[data-theme="kinetic-type"] h1::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--divider);
  margin-left: var(--space-2xs);
}

:root[data-theme="kinetic-type"] #topbar {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  transition: opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="kinetic-type"] #volumeValue {
  font-family: var(--font-mono);
  color: var(--text);
}

:root[data-theme="kinetic-type"] #tabs {
  gap: var(--space-lg);
  margin-bottom: var(--space-xl);
  transition: opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="kinetic-type"] .tab-btn {
  position: relative;
  flex: 0 0 auto;
  border: none;
  color: var(--text-dim);
  font-size: 1.0625rem;
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-tight);
  padding: 0 0 var(--space-xs);
}

:root[data-theme="kinetic-type"] .tab-btn:hover { color: var(--text-muted); background: none; }
:root[data-theme="kinetic-type"] .tab-btn:active { transform: translateY(1px); }
:root[data-theme="kinetic-type"] .tab-btn.active { color: var(--text); border-bottom-color: transparent; }

:root[data-theme="kinetic-type"] .tab-btn.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 3px;
  background: var(--accent);
}

:root[data-theme="kinetic-type"] #heroZone {
  padding-top: var(--space-md);
}

:root[data-theme="kinetic-type"] #beatFlash {
  top: 0;
  left: 0;
  right: 0;
  bottom: auto;
  height: 2px;
  background: var(--accent);
}

:root[data-theme="kinetic-type"] #beatFlash.beat { animation: kinetic-type-rule-flash 300ms ease-out; }

:root[data-theme="kinetic-type"] #beatFlash.beat.beat-accent {
  height: 4px;
  background: var(--accent-beat);
}

:root[data-theme="kinetic-type"] .hero-frame {
  display: flex;
  align-items: flex-end;
  padding-bottom: var(--space-2xs);
  border-bottom: 1px solid var(--divider);
}

:root[data-theme="kinetic-type"] .hero-readout {
  display: flex;
  align-items: flex-end;
  gap: var(--space-xs);
}

:root[data-theme="kinetic-type"] #heroBpm {
  min-width: 3ch;
  font-size: clamp(5rem, 25vw, 9rem);

:root[data-theme="pulse-field"] {

  --text-dim:          #4e4e5c;
  --accent:            #ffa726;
  --accent-beat:       #ff5a5a;

  --accent-glow:       color-mix(in srgb, var(--accent) 30%, transparent);
  --dot-idle:          #383846;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        30ms;
  --dot-decay:         520ms;
  --dot-ease:          cubic-bezier(0.1, 0.82, 0.25, 1);
  --content-max-width: 520px;
  --radius:            10px;
  --radius-panel:      20px;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-ui);

  /* theme-private */
  --ink:          #f2f3f7;
  --accent-bloom: color-mix(in srgb, var(--accent) 16%, transparent);
  --beat-bloom:   color-mix(in srgb, var(--accent-beat) 20%, transparent);
  --shadow-panel: 0 20px 44px -20px rgba(0, 0, 0, 0.95);

  /* .step-btn:hover / .quick-select-toggle:hover / .quick-select-option:hover
     (@layer components) read the shared --neutral-850 primitive directly for
     their hover surface — see Global Constraints. This theme needs two
     different hover tints (the step/tap/quick-select-toggle trio at 0.09
     alpha vs. the popup option at 0.07 alpha), so only the popup option's
     hover is driven through this token; the trio gets its own explicit
     theme rule below instead (not an edit to the locked component rule). */
  --neutral-850: rgba(255, 255, 255, 0.07);
}

:root[data-theme="pulse-field"] body {
  background:
    radial-gradient(ellipse 90% 55% at 50% 0%, #14141c 0%, transparent 65%),
    var(--bg);
}

/* Structural: the prototype puts position/isolation on #heroZone, but here

   This theme also shows the beat dots above the readout — #beatIndicator is
   the shared skeleton's last child, so order:-1 moves it to the front of the
   now-flex-column .hero-frame without touching markup. */
:root[data-theme="pulse-field"] .hero-frame {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
}

:root[data-theme="pulse-field"] #beatIndicator { order: -1; }

/* The signature: every audible beat blooms the canvas. Capped at 100vw (kept

  left: 50%;
  top: 42%;
  right: auto;
  bottom: auto;
  z-index: -1;
  width: min(150%, 100vw);
  aspect-ratio: 1;
  border-radius: var(--radius-round);
  transform: translate(-50%, -50%) scale(0.35);
  background: radial-gradient(circle, var(--accent-bloom) 0%, transparent 62%);

  animation-duration: 680ms;

:root[data-theme="pulse-field"] #heroBpm {

:root[data-theme="pulse-field"] .beat-dot {

:root[data-theme="pulse-field"] body.playing #tabs:focus-within,

:root[data-theme="pulse-field"] label,

  min-width: 15rem;
  padding: 1.05rem var(--space-2xl);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  box-shadow: 0 10px 34px -10px var(--accent-glow), 0 4px 12px rgba(0, 0, 0, 0.5);
  transition: background-color var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-fast) var(--ease-standard),
              filter var(--duration-fast) var(--ease-standard),
              transform var(--duration-instant) var(--ease-standard);
}

:root[data-theme="pulse-field"] #startStop:hover {
  filter: brightness(1.07);
  box-shadow: 0 12px 40px -10px var(--accent-glow), 0 4px 12px rgba(0, 0, 0, 0.5);
}

:root[data-theme="pulse-field"] #startStop:active { transform: scale(0.975); }

:root[data-theme="pulse-field"] #startStop.is-playing {
  background: var(--accent-beat);
  color: #fff;
  box-shadow: 0 10px 34px -10px var(--beat-bloom), 0 4px 12px rgba(0, 0, 0, 0.5);
}

:root[data-theme="grid-console"] {
  --bg:                #050507;
  --panel:             #101014;
  --overlay:           #1d1d23;
  --divider:           #33333d;
  --text:              #e9eaef;
  --text-muted:        #9aa0aa;
  --text-dim:          #5a5a67;
  --accent:            #ffb020;
  --accent-beat:       #ff4f4f;
  --on-accent:         #170e00;
  --accent-glow:       color-mix(in srgb, var(--accent) 40%, transparent);
  --dot-idle:          #131318;
  --dot-pulse-bg:      var(--accent);
  --dot-accent-bg:     var(--accent-beat);
  --dot-strike:        30ms;
  --dot-decay:         280ms;
  --dot-ease:          cubic-bezier(0.15, 0.8, 0.3, 1);
  --content-max-width: 880px;
  --radius:            2px;
  --radius-panel:      0;
  --font-ui:      system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "Cascadia Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-mono);

  /* theme-private */
  --field:      #0a0a0d;
  --rule-faint: #26262e;
  --key-bg:     #1d1d23;

  /* .step-btn:hover / .quick-select-toggle:hover / .quick-select-option:hover
     (@layer components) read the shared --neutral-850 primitive directly for
     their hover surface — see Global Constraints. This theme's step/tap/
     quick-select-toggle trio gets its own explicit accent-colored hover rule
     below instead (not an edit to the locked component rule), so only the
     popup option's hover actually ends up driven through it here;
     overridden to match the source experiment's --neutral-800.
     --neutral-900 is a second, unused-elsewhere base
     primitive repurposed here (matching the source experiment's own
     --neutral-900) for the tab hover/active surface, which needs a
     different, darker tint. */
  --neutral-850: #26262e;
  --neutral-900: #16161b;
}

:root[data-theme="grid-console"] body {
  margin: var(--space-xl) auto;
  padding: 0 var(--space-md) var(--space-xl);
}

/* Register bar. No h1 span rule: unlike the source's standalone <h1>Metronome
   <span>Console</span></h1>, the merged app's masthead h1 has no span child
   (see Task 3) — matches Tasks 5-7's identical omission for the same reason. */
:root[data-theme="grid-console"] h1 {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  color: var(--text);
}

:root[data-theme="grid-console"] h1::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--divider);
}

/* Console rail */
:root[data-theme="grid-console"] #topbar {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  align-items: stretch;
  padding: 0;
  margin-bottom: var(--space-sm);
  background: var(--panel);
  border: 1px solid var(--divider);
  transition: opacity var(--duration-moderate) var(--ease-standard);
}

:root[data-theme="grid-console"] #topbar > label {
  padding: var(--space-2xs) var(--space-xs) var(--space-xs);
  border-right: 1px solid var(--rule-faint);
}

:root[data-theme="grid-console"] #topbar > label:nth-child(2) { border-right: none; }

:root[data-theme="grid-console"] #topbar .full {
  border-top: 1px solid var(--rule-faint);
  border-right: none;
}

/* Layout-only delta from the shared label default (already flex-column) —
   typography comes from the generic label rule further below. */
:root[data-theme="grid-console"] #topbar label { gap: 0.3rem; }

:root[data-theme="grid-console"] #volumeValue {
  font-family: var(--font-mono);
  color: var(--text);
}

/* Mode selector */
:root[data-theme="grid-console"] #tabs {
  gap: 0;
  margin-bottom: var(--space-sm);
  border: 1px solid var(--divider);
  transition: opacity var(--duration-moderate) var(--ease-standard);
}

/* Shared .tab-btn uses `font: inherit`, which resets font-weight with no
   later declaration to restore it — must restate here, along with
   letter-spacing/text-transform which the shared rule never sets at all. */
:root[data-theme="grid-console"] .tab-btn {
  background: var(--panel);
  border: none;
  border-right: 1px solid var(--rule-faint);
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  padding: 0.7rem 0.3rem;
  transition: color var(--duration-fast) var(--ease-standard),
              background-color var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-fast) var(--ease-standard);
}

:root[data-theme="grid-console"] .tab-btn:last-child { border-right: none; }
:root[data-theme="grid-console"] .tab-btn:hover { color: var(--text); background: var(--neutral-900); }

:root[data-theme="grid-console"] .tab-btn.active {
  color: var(--accent);
  background: var(--neutral-900);
  box-shadow: inset 0 -3px 0 var(--accent);
}

/* Primary readout — #heroZone's border/background move to .hero-frame; its
   margin-bottom stays here on the wrapper, per the Structural mapping. */
:root[data-theme="grid-console"] #heroZone { margin-bottom: var(--space-sm); }

:root[data-theme="grid-console"] .hero-frame {
  border: 1px solid var(--divider);
  background: var(--panel);
}

/* .console-cell--primary → .hero-readout, including its corner register
   marks. position:relative establishes the containing block for them. */
:root[data-theme="grid-console"] .hero-readout {
  position: relative;
  padding: var(--space-lg) var(--space-md) var(--space-sm);
  text-align: center;
}

:root[data-theme="grid-console"] .hero-readout::before,
:root[data-theme="grid-console"] .hero-readout::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border-style: solid;
  border-color: var(--accent);
  pointer-events: none;
}

:root[data-theme="grid-console"] .hero-readout::before { top: 6px;    left: 6px;  border-width: 2px 0 0 2px; }
:root[data-theme="grid-console"] .hero-readout::after  { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

:root[data-theme="grid-console"] #beatFlash { border: 1px solid var(--accent); }
:root[data-theme="grid-console"] #beatFlash.beat { animation: grid-console-cell-strike 220ms ease-out; }

:root[data-theme="grid-console"] #beatFlash.beat.beat-accent {
  border-width: 2px;
  border-color: var(--accent-beat);
  animation-duration: 340ms;
}

/* #heroBpm's font-family already resolves through --font-display (=
   --font-mono here), and font-weight/line-height/letter-spacing/color/
   tabular-nums already match the shared default exactly — only font-size
   differs. #heroBpm stays at var(--font-weight-bold) per Global Constraints. */
:root[data-theme="grid-console"] #heroBpm {
  font-size: clamp(3.5rem, 14vw, 5.25rem);
}

:root[data-theme="grid-console"] #heroBpmLabel {
  font-family: var(--font-mono);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.4em;
  text-indent: 0.4em;
  color: var(--text-dim);
}

/* Beat matrix — .console-cell--beats' border-top/padding/background move
   onto #beatIndicator itself (scoped to .hero-frame's), per the Structural
   mapping. margin-bottom:0 replaces the shared bottom margin, which would
   otherwise double up with this cell's own padding. --field matches the
   source's --neutral-980 exactly (no shared equivalent primitive exists). */
:root[data-theme="grid-console"] .hero-frame #beatIndicator {
  gap: 5px;
  margin-bottom: 0;
  padding: var(--space-sm);
  border-top: 1px solid var(--rule-faint);
  background: var(--field);
}

:root[data-theme="grid-console"] .beat-dot {
  width: 26px;
  height: 26px;
  border: 1px solid var(--divider);
  border-radius: 0;
  /* geometry only — the transition shorthand stays in the components layer */
}

:root[data-theme="grid-console"] .beat-dot.pulse {
  border-color: var(--accent);
  box-shadow: 0 0 14px -2px var(--accent-glow);
}

:root[data-theme="grid-console"] .beat-dot.pulse.accent {
  border-color: var(--accent-beat);
  box-shadow: 0 0 16px -2px color-mix(in srgb, var(--accent-beat) 45%, transparent);
}

:root[data-theme="grid-console"] #beatIndicator .beat-dot:nth-child(4n):not(:last-child) { margin-right: 9px; }

:root[data-theme="grid-console"] .readout {
  font-family: var(--font-mono);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  padding: 0.5rem var(--space-sm);
  border-top: 1px solid var(--rule-faint);
}

:root[data-theme="grid-console"] .phase-segment {
  padding: 2px 7px;
  border: 1px solid transparent;
  color: var(--text-dim);
  transition: color var(--duration-fast) var(--ease-standard),
              background-color var(--duration-fast) var(--ease-standard),
              border-color var(--duration-fast) var(--ease-standard);
}

:root[data-theme="grid-console"] .phase-segment.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: var(--font-weight-bold);
}

/* Parameter table */
:root[data-theme="grid-console"] .panel {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding-bottom: 0;
  margin-bottom: var(--space-sm);
  border: 1px solid var(--divider);
  background: var(--panel);
  transition: opacity var(--duration-moderate) var(--ease-standard);
}

/* This theme gives .panel a display (restated above, same value as the
   shared default, but now in the themes layer), so the shared [hidden]
   guard needs restating too or a hidden panel would render anyway. */
:root[data-theme="grid-console"] .panel[hidden] { display: none; }

:root[data-theme="grid-console"] body.playing #topbar,
:root[data-theme="grid-console"] body.playing #tabs,
:root[data-theme="grid-console"] body.playing .panel {
  /* 0.76 is the lowest opacity (to 2dp) that keeps --text-muted on
     --panel at >=4.5:1 while de-emphasized (computed, not eyeballed —
     see final-fix-report.md). Do not lower without recomputing. */
  opacity: 0.76;
}

:root[data-theme="grid-console"] body.playing #topbar:hover,
:root[data-theme="grid-console"] body.playing #topbar:focus-within,
:root[data-theme="grid-console"] body.playing #tabs:hover,
:root[data-theme="grid-console"] body.playing #tabs:focus-within,
:root[data-theme="grid-console"] body.playing .panel:hover,
:root[data-theme="grid-console"] body.playing .panel:focus-within {
  opacity: 1;
}

:root[data-theme="grid-console"] .field-group,
:root[data-theme="grid-console"] .panel > label {
  display: grid;
  grid-template-columns: minmax(5rem, 7.5rem) minmax(0, 1fr);
  align-items: center;
  gap: var(--space-2xs) var(--space-sm);
  padding: var(--space-2xs) var(--space-xs);
  border-bottom: 1px solid var(--rule-faint);
}

:root[data-theme="grid-console"] .panel > *:last-child { border-bottom: none; }
:root[data-theme="grid-console"] .field-group > label { grid-column: 1; }
:root[data-theme="grid-console"] .field-group > .stepper-row { grid-column: 2; }
:root[data-theme="grid-console"] .field-group > input[type="range"] { grid-column: 2; }
:root[data-theme="grid-console"] .panel > label > select { grid-column: 2; }

@media (max-width: 560px) {
  :root[data-theme="grid-console"] .field-group,
  :root[data-theme="grid-console"] .panel > label { grid-template-columns: 1fr; }
  :root[data-theme="grid-console"] .field-group > .stepper-row,
  :root[data-theme="grid-console"] .field-group > input[type="range"],
  :root[data-theme="grid-console"] .panel > label > select { grid-column: 1; }
}

/* Covers every <label> (topbar rows, .panel > label rows) and .field-group
   itself; source repeats this typography identically for #topbar label and
   .field-group > label/.panel > label, so one shared rule here covers both.
   Classic deliberately has no equivalent rule and keeps "Volume 80%" inline. */
:root[data-theme="grid-console"] label,
:root[data-theme="grid-console"] .field-group {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-dim);
}

:root[data-theme="grid-console"] label > span {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2xs);
}

/* Controls. font-family/letter-spacing/text-transform restated below not
   just because of `font: inherit`, but because these fields sit inside a
   .field-group/label ancestor that now sets uppercase + wide mono tracking,
   which they'd otherwise inherit unwanted. */
:root[data-theme="grid-console"] input[type="number"],
:root[data-theme="grid-console"] select {
  background: var(--field);
  border: 1px solid var(--divider);
  padding: 0.4rem 0.45rem;
  font-family: var(--font-mono);
  font-size: 0.9375rem;
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0;
  text-transform: none;
  transition: border-color var(--duration-fast) var(--ease-standard),
              background-color var(--duration-fast) var(--ease-standard);
}

:root[data-theme="grid-console"] input[type="number"] { text-align: center; }

/* border-color restated even though it matches the shared :focus rule's
   value: the base input rule above uses a `border` shorthand which, being
   in the same layer, would otherwise leave focused fields at --divider. */
:root[data-theme="grid-console"] input[type="number"]:focus,
:root[data-theme="grid-console"] select:focus {
  border-color: var(--accent);
  background: var(--neutral-900);
}

/* Same shorthand reasoning as :focus above. */
:root[data-theme="grid-console"] input[type="number"].clamped { border-color: var(--accent-beat); }

:root[data-theme="grid-console"] input[type="range"] {
  border-radius: 0;
  background: var(--rule-faint);
}

:root[data-theme="grid-console"] input[type="range"]::-webkit-slider-thumb {
  width: 8px;
  height: 20px;
  border-radius: 0;
}

:root[data-theme="grid-console"] input[type="range"]::-moz-range-thumb {
  width: 8px;
  height: 20px;
  border-radius: 0;
}

:root[data-theme="grid-console"] input[type="range"]::-moz-range-track {
  border-radius: 0;
  background: var(--rule-faint);
}

:root[data-theme="grid-console"] .stepper-row {
  display: flex; flex-wrap: wrap; gap: 3px; align-items: stretch; min-width: 0;
}

:root[data-theme="grid-console"] .stepper-row input[type="number"] {
  flex: 1 1 4rem; min-width: 3.5rem;
}

:root[data-theme="grid-console"] .step-group { gap: 3px; }

:root[data-theme="grid-console"] .step-btn,
:root[data-theme="grid-console"] .tapTempo,
:root[data-theme="grid-console"] .quick-select-toggle {
  background: var(--overlay);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  font-family: var(--font-mono);
  font-size: 0.9375rem;
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0;
  text-transform: none;
}

:root[data-theme="grid-console"] .step-btn { width: 2rem; }

/* Shared .step-btn.step-5 (@layer components) already sets font-size:
   var(--text-xs) / font-weight: bold — the same values this theme wants —
   but the trio rule above is in @layer themes, which beats that shared rule
   on layer order alone regardless of specificity. Without restating it here,
   step-5 buttons would incorrectly pick up the trio's 0.9375rem/semibold
   base size instead. */
:root[data-theme="grid-console"] .step-btn.step-5 {
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
}

:root[data-theme="grid-console"] .tapTempo {
  padding: 0 var(--space-sm);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
}

:root[data-theme="grid-console"] .quick-select-toggle { width: 1.5rem; font-size: var(--text-xs); }

:root[data-theme="grid-console"] .step-btn:hover,
:root[data-theme="grid-console"] .tapTempo:hover,
:root[data-theme="grid-console"] .quick-select-toggle:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

:root[data-theme="grid-console"] .step-btn:active,
:root[data-theme="grid-console"] .tapTempo:active,
:root[data-theme="grid-console"] .quick-select-toggle:active { transform: translateY(1px); }

:root[data-theme="grid-console"] .quick-select-toggle[aria-expanded="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

:root[data-theme="grid-console"] .quick-select-popup { padding: 0; }

:root[data-theme="grid-console"] .quick-select-option {
  padding: 0.35rem var(--space-sm);
  font-family: var(--font-mono);
  font-size: 0.9375rem;
  border-bottom: 1px solid var(--rule-faint);
}

:root[data-theme="grid-console"] .quick-select-option:last-child { border-bottom: none; }

/* Shared .quick-select-option.highlighted (@layer components) sets only
   background/color — no font-weight — so the source's bold highlighted row
   does not fall through and must be restated here. */
:root[data-theme="grid-console"] .quick-select-option.highlighted {
  font-weight: var(--font-weight-bold);
}

/* Transport */
:root[data-theme="grid-console"] #controls { display: block; }

:root[data-theme="grid-console"] #startStop {
  width: 100%;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 0.95rem var(--space-xl);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  text-transform: uppercase;
  transition: background-color var(--duration-fast) var(--ease-standard),
              border-color var(--duration-fast) var(--ease-standard),
              transform var(--duration-instant) var(--ease-standard);
}

:root[data-theme="grid-console"] #startStop:active { transform: translateY(1px); }

:root[data-theme="grid-console"] #startStop.is-playing {
  background: var(--accent-beat);
  border-color: var(--accent-beat);
  color: #fff;
}

/* Two-column console. #masthead (not h1) is the grid-area target — Task 3
   wraps the title in a <header id="masthead">, so the grid areas must target
   the wrapper. The parameter column gets the extra room: the readout only
   needs to fit three big digits, the stepper rows need everything they can
   get. Fixed-position elements (the quick-select popup, appended to
   document.body) don't participate in grid layout, so this doesn't disturb it. */
@media (min-width: 880px) {
  :root[data-theme="grid-console"] body {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
    gap: var(--space-sm);
    align-items: start;
  }

  :root[data-theme="grid-console"] #masthead { grid-area: 1 / 1 / 2 / 3; margin-bottom: 0; }
  :root[data-theme="grid-console"] #topbar   { grid-area: 2 / 1 / 3 / 3; margin-bottom: 0; }
  :root[data-theme="grid-console"] #tabs     { grid-area: 3 / 1 / 4 / 2; margin-bottom: 0; }
  :root[data-theme="grid-console"] .panel    { grid-area: 4 / 1 / 5 / 2; margin-bottom: 0; }
  :root[data-theme="grid-console"] #controls { grid-area: 5 / 1 / 6 / 2; }

  :root[data-theme="grid-console"] #heroZone {
    grid-area: 3 / 2 / 6 / 3;
    position: sticky;
    top: var(--space-xl);
    margin-bottom: 0;
  }
}

}

@keyframes pulse-engine-shell-strike {
  from { opacity: 0.85; }
  to   { opacity: 0; }
}

@keyframes pulse-engine-transport-ring {
  0%, 100% { transform: scale(1);    opacity: 0.45; }
  50%      { transform: scale(1.06); opacity: 0.12; }
}

@keyframes kinetic-type-rule-flash {
  from { opacity: 1; }
  to   { opacity: 0; }
}

@keyframes pulse-field-bloom {
  from { opacity: 0.9; transform: translate(-50%, -50%) scale(0.32); }
  to   { opacity: 0;   transform: translate(-50%, -50%) scale(1); }
}

@keyframes grid-console-cell-strike {
  from { opacity: 1; }
  to   { opacity: 0; }
}

@layer motion {

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-fast: var(--duration-instant);
  }

  :root[data-theme="pulse-engine"] {
    --dot-decay: 90ms;
  }

  :root[data-theme="kinetic-type"] {
    --dot-decay: 90ms;
  }

  :root[data-theme="pulse-field"] {
    --dot-decay: 100ms;
  }

  :root[data-theme="grid-console"] {
    --dot-decay: 80ms;
  }
}

}

</head>
<body>
  <header id="masthead">
    <h1>Guitar Practice&nbsp;Metronome</h1>
    <select id="themeSelect" aria-label="Theme"></select>
  </header>

  <div id="topbar">
    <label>Sound
      <select id="soundStyle">
        <option value="click">Click</option>
        <option value="beep">Beep</option>
        <option value="wood">Wood Block</option>
      </select>
    </label>
    <label class="full">
      <span>Volume <span id="volumeValue">80%</span></span>
      <input id="volume" type="range" min="0" max="100" step="1" value="80">
    </label>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="metronome" type="button">Metronome</button>
    <button class="tab-btn" data-tab="ramp" type="button">Ramp</button>
    <button class="tab-btn" data-tab="practice" type="button">Practice</button>
